    });
    applyUnderwaterOpticalShader(brainMat, 1.08, 'brain_coral');

    function createBrainCoral(x, y, z, radius) {
      const geo = new THREE.SphereGeometry(radius, 40, 28, 0, Math.PI * 2, 0, Math.PI * 0.62);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const vx = pos.getX(i);
        const vy = pos.getY(i);
        const vz = pos.getZ(i);
        const lobe = 1.0 + Math.sin(vx * 14) * Math.cos(vz * 14) * 0.042;
        pos.setXYZ(i, vx * lobe, vy * 0.85 * lobe, vz * lobe);
      }
      geo.computeVertexNormals();
      const mesh = new THREE.Mesh(geo, brainMat);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
    }

    createBrainCoral(1.62, 0.68, 0.42, 0.36);
    createBrainCoral(-1.72, 0.74, 0.22, 0.32);

    // Branching Staghorn Corals
    function createStaghornCoral(basePos, colorHex, emissiveHex, scale = 1.0) {
      const mat = new THREE.MeshStandardMaterial({
        color: colorHex,
        normalMap: pbr.coralNormalMap,
        emissive: emissiveHex,
        emissiveIntensity: 0.12,
        roughness: 0.50,
        metalness: 0.04
      });
      applyUnderwaterOpticalShader(mat, 0.98, `staghorn_${colorHex}`);

      const group = new THREE.Group();
      group.position.copy(basePos);

      const growBranch = (origin, dir, len, rad, depth) => {
        if (depth <= 0) return;
        const end = origin.clone().addScaledVector(dir, len);
        const mid = origin.clone().lerp(end, 0.5).add(new THREE.Vector3(
          (Math.random() - 0.5) * 0.06, 0.03, (Math.random() - 0.5) * 0.06
        ));
        const curve = new THREE.CatmullRomCurve3([origin, mid, end]);
        const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 8, rad, 8, false), mat);
        mesh.castShadow = true;
        group.add(mesh);

        const tip = new THREE.Mesh(new THREE.SphereGeometry(rad * 1.05, 8, 8), mat);
        tip.position.copy(end);
        group.add(tip);

        const forks = depth === 3 ? 3 : 2;
        for (let f = 0; f < forks; f++) {
          const angle = (f / forks) * Math.PI * 2 + Math.random() * 0.8;
          const spread = 0.42 + Math.random() * 0.22;
          const newDir = new THREE.Vector3(
            dir.x + Math.cos(angle) * spread,
            Math.max(0.45, dir.y * 0.92),
            dir.z + Math.sin(angle) * spread
          ).normalize();
          growBranch(end, newDir, len * 0.74, rad * 0.72, depth - 1);
        }
      };

      growBranch(new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 1, 0), 0.34 * scale, 0.036 * scale, 3);
      scene.add(group);
      return mat;
    }

    const staghornMats = [
      createStaghornCoral(new THREE.Vector3(2.35, 1.18, -0.2), 0xf472b6, 0xf43f5e, 1.15),
      createStaghornCoral(new THREE.Vector3(2.75, 0.94,  0.35), 0xfb923c, 0xf97316, 0.95),
      createStaghornCoral(new THREE.Vector3(-2.55, 1.08, -0.45), 0xc084fc, 0xa855f7, 1.05)
    ];

    // Swaying Vallisneria / Giant Kelp Ribbons
    const kelpBladeGeo = new THREE.PlaneGeometry(0.105, 1.0, 2, 16);
    kelpBladeGeo.translate(0, 0.5, 0);
    const kPos = kelpBladeGeo.attributes.position;
    for (let i = 0; i < kPos.count; i++) {
      const y = kPos.getY(i);
      kPos.setX(i, kPos.getX(i) * Math.sin(y * Math.PI * 0.85 + 0.25));
    }
    kelpBladeGeo.computeVertexNormals();

    const kelpMat = new THREE.MeshStandardMaterial({
      color: 0x2d8a56,
      roughness: 0.44,
      metalness: 0.02,
      side: THREE.DoubleSide
    });
    applyUnderwaterOpticalShader(kelpMat, 0.88, 'kelp');
    const origKelpCompile = kelpMat.onBeforeCompile;
    kelpMat.onBeforeCompile = (shader) => {
      origKelpCompile(shader);
      shader.vertexShader = shader.vertexShader.replace(
        '#include <begin_vertex>',
        `#include <begin_vertex>
        float hFactor = pow(clamp(position.y, 0.0, 1.0), 1.45);
        float instSeed = 0.0;
        #ifdef USE_INSTANCING
          instSeed = instanceMatrix[3][0] * 1.7 + instanceMatrix[3][2] * 2.3;
        #endif
        float swayT = uTime * (1.1 + uCurrentSpeed * 0.95) + instSeed;
        transformed.x += sin(swayT + position.y * 3.6) * 0.24 * hFactor * (0.6 + uCurrentSpeed * 0.4);
        transformed.z += cos(swayT * 0.85 + position.y * 2.9) * 0.13 * hFactor;`
      );
    };

    const kelpCount = 160;
    const kelpInst = new THREE.InstancedMesh(kelpBladeGeo, kelpMat, kelpCount);
    const kelpClusters = [
      { x: -3.55, z: -1.55, r: 0.85 },
      { x: -1.95, z: -1.72, r: 0.95 },
      { x:  0.35, z: -1.78, r: 1.05 },
      { x:  3.45, z: -1.45, r: 0.90 },
      { x:  3.60, z:  0.85, r: 0.65 },
      { x: -3.60, z:  0.75, r: 0.65 }
    ];

    for (let i = 0; i < kelpCount; i++) {
      const cl = kelpClusters[i % kelpClusters.length];
      const ang = Math.random() * Math.PI * 2;
      const dist = Math.random() * cl.r;
      const kx = THREE.MathUtils.clamp(cl.x + Math.cos(ang) * dist, -TANK.halfW + 0.22, TANK.halfW - 0.22);
      const kz = THREE.MathUtils.clamp(cl.z + Math.sin(ang) * dist, -TANK.halfD + 0.22, TANK.halfD - 0.22);
      const ky = getSandHeight(kx, kz) - 0.03;

      dummy.position.set(kx, ky, kz);
      dummy.rotation.set(0, Math.random() * Math.PI * 2, 0);
      dummy.scale.set(0.8 + Math.random() * 0.5, 1.2 + Math.random() * 1.95, 1.0);
      dummy.updateMatrix();
      kelpInst.setMatrixAt(i, dummy.matrix);

      colorTmp.setHSL(0.35 + (Math.random() - 0.5) * 0.06, 0.60, 0.26 + Math.random() * 0.18);
      kelpInst.setColorAt(i, colorTmp);
    }
    kelpInst.instanceMatrix.needsUpdate = true;
    if (kelpInst.instanceColor) kelpInst.instanceColor.needsUpdate = true;
    scene.add(kelpInst);

    // Bubble-Tip Sea Anemones
    const tentacleGeo = new THREE.CylinderGeometry(0.022, 0.011, 1.0, 8, 8);
    tentacleGeo.translate(0, 0.5, 0);
    const tPos = tentacleGeo.attributes.position;
    for (let i = 0; i < tPos.count; i++) {
      const y = tPos.getY(i);
      const bulb = 1.0 + Math.exp(-Math.pow((y - 0.82) * 9.0, 2.0)) * 0.85;
      tPos.setX(i, tPos.getX(i) * bulb);
      tPos.setZ(i, tPos.getZ(i) * bulb);
    }
    tentacleGeo.computeVertexNormals();

    const anemoneMat = new THREE.MeshStandardMaterial({
      color: 0xff7eb3,
      emissive: 0x38bdf8,
      emissiveIntensity: 0.22,
      roughness: 0.35
    });
    applyUnderwaterOpticalShader(anemoneMat, 0.82, 'anemone');
    const origAnemoneCompile = anemoneMat.onBeforeCompile;
    anemoneMat.onBeforeCompile = (shader) => {
      origAnemoneCompile(shader);
      shader.vertexShader = shader.vertexShader.replace(
        '#include <begin_vertex>',
        `#include <begin_vertex>
        float tFactor = pow(clamp(position.y, 0.0, 1.0), 1.5);
        float aSeed = 0.0;
        #ifdef USE_INSTANCING
          aSeed = instanceMatrix[3][0] * 4.1 + instanceMatrix[3][2] * 3.7;
        #endif
        float aTime = uTime * (1.5 + uCurrentSpeed) + aSeed;
        transformed.x += sin(aTime + position.y * 4.0) * 0.14 * tFactor;
        transformed.z += cos(aTime * 0.9 + position.y * 4.0) * 0.14 * tFactor;`
      );
    };

    const anemoneCount = 100;
    const anemoneInst = new THREE.InstancedMesh(tentacleGeo, anemoneMat, anemoneCount);
    const anemoneCenters = [
      new THREE.Vector3(-1.35, getSandHeight(-1.35, 0.72), 0.72),
      new THREE.Vector3( 1.95, 0.86, -0.05)
    ];

    for (let i = 0; i < anemoneCount; i++) {
      const center = anemoneCenters[i % anemoneCenters.length];
      const ring = Math.random();
      const theta = Math.random() * Math.PI * 2;
      const rad = ring * 0.25;
      dummy.position.set(
        center.x + Math.cos(theta) * rad,
        center.y - 0.02,
        center.z + Math.sin(theta) * rad
      );
      dummy.rotation.set(Math.sin(theta) * ring * 0.65, theta, -Math.cos(theta) * ring * 0.65);
      dummy.scale.set(1.0, 0.25 + (1.0 - ring * 0.38) * 0.24, 1.0);
      dummy.updateMatrix();
      anemoneInst.setMatrixAt(i, dummy.matrix);

      colorTmp.setHSL(0.92 - ring * 0.14, 0.80, 0.56 + ring * 0.16);
      anemoneInst.setColorAt(i, colorTmp);
    }
    anemoneInst.instanceMatrix.needsUpdate = true;
    if (anemoneInst.instanceColor) anemoneInst.instanceColor.needsUpdate = true;
    scene.add(anemoneInst);

    // =========================================================================
    // 8. CUSTOM GLSL OPTICAL WATER SURFACE (SNELL'S WINDOW + FRESNEL + RIPPLES)
    // =========================================================================
    const MAX_RIPPLES = 8;
    const rippleData = Array.from({ length: MAX_RIPPLES }, () => new THREE.Vector4(0, 0, -999, 0));
    let rippleCursor = 0;

    function triggerWaterRipple(x, z, amp = 0.028) {
      rippleData[rippleCursor].set(x, z, sharedOpticalUniforms.uTime.value, amp);
      rippleCursor = (rippleCursor + 1) % MAX_RIPPLES;
    }

    function evalWaterWave(x, z, t, speed) {
      const wt = t * (1.2 + speed * 0.85);
      const w1 = Math.sin(x * 2.4 + wt * 1.6) * Math.cos(z * 2.8 - wt * 1.2) * 0.024;
      const w2 = Math.sin((x - z) * 4.6 + wt * 2.3) * 0.010;
      const w3 = Math.cos(x * 7.4 + z * 6.2 - wt * 3.1) * 0.005;
      return w1 + w2 + w3;
    }

    const waterSurfaceUniforms = {
      uTime: sharedOpticalUniforms.uTime,
      uCurrentSpeed: sharedOpticalUniforms.uCurrentSpeed,
      uWaterNormalMap: { value: pbr.waterNormalMap },
      uSkyColor: { value: new THREE.Color(0xc8f4ff) },
      uDeepWaterColor: { value: new THREE.Color(0x0c4a6e) },
      uSunDir: { value: new THREE.Vector3(0.25, 0.92, 0.28).normalize() },
      uSunColor: { value: new THREE.Color(0xffffff) },
      uAeratorPos: { value: new THREE.Vector2(3.15, -0.75) },
      uBubbleIntensity: { value: 1.0 },
      uRipples: { value: rippleData }
    };

    const waterSurfaceMat = new THREE.ShaderMaterial({
      uniforms: waterSurfaceUniforms,
      transparent: true,
      depthWrite: false,
      side: THREE.DoubleSide,
      vertexShader: `
        uniform float uTime;
        uniform float uCurrentSpeed;
        uniform vec4 uRipples[${MAX_RIPPLES}];
        varying vec3 vWorldPos;
        varying vec2 vUv;
        varying vec3 vAnalyticalNormal;

        void main() {
          vUv = uv;
          vec3 pos = position;
          float wt = uTime * (1.2 + uCurrentSpeed * 0.85);

          // Multi-harmonic capillary & gravity waves
          float h = sin(pos.x * 2.4 + wt * 1.6) * cos(pos.z * 2.8 - wt * 1.2) * 0.024
                  + sin((pos.x - pos.z) * 4.6 + wt * 2.3) * 0.010
                  + cos(pos.x * 7.4 + pos.z * 6.2 - wt * 3.1) * 0.005;

          float dhdx = 2.4 * cos(pos.x * 2.4 + wt * 1.6) * cos(pos.z * 2.8 - wt * 1.2) * 0.024
                     + 4.6 * cos((pos.x - pos.z) * 4.6 + wt * 2.3) * 0.010
                     - 7.4 * sin(pos.x * 7.4 + pos.z * 6.2 - wt * 3.1) * 0.005;

          float dhdz = -2.8 * sin(pos.x * 2.4 + wt * 1.6) * sin(pos.z * 2.8 - wt * 1.2) * 0.024
                     - 4.6 * cos((pos.x - pos.z) * 4.6 + wt * 2.3) * 0.010
                     - 6.2 * sin(pos.x * 7.4 + pos.z * 6.2 - wt * 3.1) * 0.005;

          // Interactive expanding circular ripples from food drops
          for (int i = 0; i < ${MAX_RIPPLES}; i++) {
            vec4 rip = uRipples[i];
            float age = uTime - rip.z;
            if (age > 0.0 && age < 4.5 && rip.w > 0.0) {
              vec2 delta = pos.xz - rip.xy;
              float dist = length(delta);
              float radius = age * 1.65;
              float ring = exp(-pow((dist - radius) * 4.5, 2.0)) * exp(-age * 0.85) * rip.w;
              float phase = (dist - radius) * 24.0;
              h += sin(phase) * ring;
              if (dist > 0.001) {
                float dRing = cos(phase) * 24.0 * ring;
                dhdx += dRing * (delta.x / dist);
                dhdz += dRing * (delta.y / dist);
              }
            }
          }

          pos.y += h;
          vAnalyticalNormal = normalize(vec3(-dhdx, 1.0, -dhdz));
          vec4 wp = modelMatrix * vec4(pos, 1.0);
          vWorldPos = wp.xyz;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform float uCurrentSpeed;
        uniform sampler2D uWaterNormalMap;
        uniform vec3 uSkyColor;
        uniform vec3 uDeepWaterColor;
        uniform vec3 uSunDir;
        uniform vec3 uSunColor;
        uniform vec2 uAeratorPos;
        uniform float uBubbleIntensity;
        varying vec3 vWorldPos;
        varying vec2 vUv;
        varying vec3 vAnalyticalNormal;

        void main() {
          float t = uTime * (0.04 + uCurrentSpeed * 0.03);
          vec2 uv1 = vWorldPos.xz * 0.35 + vec2(t, t * 0.7);
          vec2 uv2 = vWorldPos.xz * 0.62 - vec2(t * 0.8, -t * 1.1);

          vec3 nMap1 = texture2D(uWaterNormalMap, uv1).xyz * 2.0 - 1.0;
          vec3 nMap2 = texture2D(uWaterNormalMap, uv2).xyz * 2.0 - 1.0;
          vec3 microN = normalize(vec3((nMap1.x + nMap2.x) * 0.42, 1.0, (nMap1.y + nMap2.y) * 0.42));

          vec3 N = normalize(vec3(
            vAnalyticalNormal.x + microN.x * 0.55,
            1.0,
            vAnalyticalNormal.z + microN.z * 0.55
          ));

          vec3 V = normalize(cameraPosition - vWorldPos);
          bool underwaterView = cameraPosition.y < vWorldPos.y;

          // Specular LED luminaire glints on wavelets
          vec3 H = normalize(uSunDir + (underwaterView ? -V : V));
          float spec = pow(max(dot(N, H), 0.0), 220.0) * 2.8;
          float softSpec = pow(max(dot(N, H), 0.0), 32.0) * 0.35;

          // Aerator bubble boil & micro-foam on water surface
          float aerDist = length(vWorldPos.xz - uAeratorPos);
          float foamRing = exp(-aerDist * aerDist * 9.0) * (0.5 + 0.5 * sin(aerDist * 28.0 - uTime * 9.0)) * uBubbleIntensity;

          if (underwaterView) {
            // SNELL'S WINDOW + TOTAL INTERNAL REFLECTION (looking up from beneath water!)
            vec3 Ndown = -N;
            float cosTheta = max(dot(Ndown, V), 0.0);
            float sinTheta = sqrt(max(0.0, 1.0 - cosTheta * cosTheta));
            // Critical angle for water (n=1.333) to air (n=1.0) is sin(48.6 deg) = 0.75
            float snellWindow = 1.0 - smoothstep(0.62, 0.78, sinTheta);
            vec3 tirMirror = mix(uDeepWaterColor * 1.6, uSkyColor * 0.75, pow(1.0 - cosTheta, 2.0));
            vec3 windowLight = uSkyColor * 1.55 + uSunColor * (spec * 1.2 + softSpec);
            vec3 col = mix(tirMirror, windowLight, snellWindow) + vec3(0.9, 0.98, 1.0) * foamRing * 0.45;
            float alpha = mix(0.84, 0.36, snellWindow);
            gl_FragColor = vec4(col, alpha);
          } else {
            // ABOVE WATER: Schlick Fresnel Reflection + Crystal Clear Transmission
            float cosTheta = max(dot(N, V), 0.0);
            float fresnel = 0.02 + 0.98 * pow(1.0 - cosTheta, 5.0);
            vec3 reflectCol = mix(uDeepWaterColor * 1.35, uSkyColor * 1.35, fresnel) + uSunColor * (spec + softSpec);
            vec3 foamCol = vec3(0.92, 0.98, 1.0) * foamRing * 0.65;
            vec3 finalCol = reflectCol + foamCol;
            float alpha = clamp(0.11 + fresnel * 0.76 + (spec + softSpec) * 0.35 + foamRing * 0.5, 0.0, 0.95);
            gl_FragColor = vec4(finalCol, alpha);
          }
        }
      `
    });

    const waterGeo = new THREE.PlaneGeometry(TANK.halfW * 2 - 0.01, TANK.halfD * 2 - 0.01, 160, 92);
    waterGeo.rotateX(-Math.PI / 2);
    const waterSurface = new THREE.Mesh(waterGeo, waterSurfaceMat);
    waterSurface.position.y = TANK.waterY;
    scene.add(waterSurface);

    // Dynamic Wave-Synchronized Meniscus Line on All 4 Glass Walls
    const meniscusPoints = [];
    const mSegs = 90;
    const hwM = TANK.halfW - 0.004;
    const hdM = TANK.halfD - 0.004;
    for (let i = 0; i <= mSegs; i++) meniscusPoints.push([-hwM + (2 * hwM * i) / mSegs, hdM]);
    for (let i = 1; i <= mSegs; i++) meniscusPoints.push([hwM, hdM - (2 * hdM * i) / mSegs]);
    for (let i = 1; i <= mSegs; i++) meniscusPoints.push([hwM - (2 * hwM * i) / mSegs, -hdM]);
    for (let i = 1; i <= mSegs; i++) meniscusPoints.push([-hwM, -hdM + (2 * hdM * i) / mSegs]);

    const meniscusGeo = new THREE.BufferGeometry();
    const meniscusPos = new Float32Array(meniscusPoints.length * 3);
    for (let i = 0; i < meniscusPoints.length; i++) {
      meniscusPos[i * 3]     = meniscusPoints[i][0];

    const meniscusLine = new THREE.Line(

    scene.add(meniscusLine);

    // Volumetric God Rays
    const godRayUniforms = {
      uTime: sharedOpticalUniforms.uTime,
      uCurrentSpeed: sharedOpticalUniforms.uCurrentSpeed,
      uRayColor: { value: new THREE.Color(0x9beeff) },
      uRayOpacity: { value: 0.14 }
    };

    const godRayMat = new THREE.ShaderMaterial({
      uniforms: godRayUniforms,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide,
      vertexShader: `
        varying vec2 vUv;
        varying vec3 vNormalView;
        varying vec3 vViewPos;
        void main() {
          vUv = uv;
          vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
          vViewPos = -mvPos.xyz;
          vNormalView = normalize(normalMatrix * normal);
          gl_Position = projectionMatrix * mvPos;
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform float uCurrentSpeed;
        uniform vec3 uRayColor;
        uniform float uRayOpacity;
        varying vec2 vUv;
        varying vec3 vNormalView;
        varying vec3 vViewPos;

        void main() {
          float edgeX = pow(max(0.0, sin(vUv.x * 3.14159265)), 2.0);
          float vertFade = smoothstep(0.0, 0.78, vUv.y) * smoothstep(1.0, 0.88, vUv.y);
          float t = uTime * (0.35 + uCurrentSpeed * 0.25);
          float s1 = sin(vUv.x * 20.0 + t * 1.3) * 0.5 + 0.5;
          float s2 = sin(vUv.x * 37.0 - t * 1.8 + vUv.y * 2.0) * 0.5 + 0.5;
          float streaks = mix(0.42, 1.0, s1 * 0.65 + s2 * 0.35);
          float viewFade = pow(abs(dot(normalize(vNormalView), normalize(vViewPos))), 1.1);
          gl_FragColor = vec4(uRayColor, edgeX * vertFade * streaks * viewFade * uRayOpacity);
        }
      `
    });

    const godRaysGroup = new THREE.Group();
    [
      { x: -1.8, z: -0.4, w: 2.5, rotY: 0.22, tiltZ: -0.14 },
      { x: -0.2, z:  0.1, w: 2.9, rotY: -0.16, tiltZ: -0.12 },

    scene.add(godRaysGroup);

    // Suspended Marine Snow / Micro-Plankton Particles
    const planktonCount = 950;
    const planktonGeo = new THREE.BufferGeometry();
    const planktonPos = new Float32Array(planktonCount * 3);
    const planktonSeed = new Float32Array(planktonCount);
    for (let i = 0; i < planktonCount; i++) {
      planktonPos[i * 3]     = (Math.random() - 0.5) * (TANK.halfW * 2 - 0.3);
      planktonPos[i * 3 + 1] = 0.45 + Math.random() * (TANK.waterY - 0.65);
      planktonPos[i * 3 + 2] = (Math.random() - 0.5) * (TANK.halfD * 2 - 0.3);

    }
    planktonGeo.setAttribute('position', new THREE.BufferAttribute(planktonPos, 3));
    const planktonPoints = new THREE.Points(
      planktonGeo,
      new THREE.PointsMaterial({

    // Physically Rising & Wobbling Air Bubbles with Custom Fresnel Rim Shader
    const maxBubbles = 220;
    const bubbleGeo = new THREE.SphereGeometry(0.024, 14, 12);
    const bubbleMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      vertexShader: `
        varying vec3 vNormalWorld;
        varying vec3 vViewDir;
        void main() {
          vec4 wp = vec4(position, 1.0);
          #ifdef USE_INSTANCING
            wp = instanceMatrix * wp;
          #endif
          wp = modelMatrix * wp;
          vec3 n = normal;
          #ifdef USE_INSTANCING
            n = mat3(instanceMatrix) * n;
          #endif
          vNormalWorld = normalize(mat3(modelMatrix) * n);
          vViewDir = normalize(cameraPosition - wp.xyz);
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: `
        varying vec3 vNormalWorld;
        varying vec3 vViewDir;
        void main() {
          vec3 N = normalize(vNormalWorld);
          vec3 V = normalize(vViewDir);
          float fresnel = pow(1.0 - abs(dot(N, V)), 2.4);
          vec3 lightDir = normalize(vec3(0.3, 0.9, 0.3));
          float spec = pow(max(dot(reflect(-lightDir, N), V), 0.0), 48.0);
          vec3 col = mix(vec3(0.55, 0.85, 1.0), vec3(1.0), fresnel) + vec3(1.0) * spec * 1.6;
          float alpha = clamp(0.14 + fresnel * 0.78 + spec * 0.85, 0.0, 0.96);
          gl_FragColor = vec4(col, alpha);

      `
    });

    const glassPaneMat = new THREE.ShaderMaterial({

        varying vec3 vWorldNormal;

    const starphireEdgeMat = new THREE.MeshPhysicalMaterial({

    const fishTex = createFishTextures();

    const tetraSchool = [];

    });
    [

    ].forEach((cfg, idx) => {

        species: 'Royal Blue Tang',

    // =========================================================================
    // 14. ANIMATION & PHYSICS LOOP
    // =========================================================================
    const tmpVec1 = new THREE.Vector3();
    const tmpVec2 = new THREE.Vector3();
    const steerSep = new THREE.Vector3();
    const steerAli = new THREE.Vector3();
    const steerCoh = new THREE.Vector3();
    const upVec = new THREE.Vector3(0, 1, 0);
    const lookMatrix = new THREE.Matrix4();
    const targetQuat = new THREE.Quaternion();

    function updateFishAI(dt, elapsed) {
      for (let i = 0; i < allFish.length; i++) {
        const fish = allFish[i];
        fish.acc.set(0, 0, 0);

        if (fish.isBoid) {
          steerSep.set(0, 0, 0);
          steerAli.set(0, 0, 0);
          steerCoh.set(0, 0, 0);
          let countAli = 0;
          let countCoh = 0;

          for (let j = 0; j < tetraSchool.length; j++) {
            if (i === j) continue;
            const other = tetraSchool[j];
            const d = fish.pos.distanceTo(other.pos);
            if (d > 0.0001 && d < 0.42) {
              tmpVec1.subVectors(fish.pos, other.pos).divideScalar(d * d);
              steerSep.add(tmpVec1);
            }
            if (d < 1.15) {
              steerAli.add(other.vel);
              countAli++;
            }
            if (d < 1.45) {
              steerCoh.add(other.pos);
              countCoh++;
            }
          }

          if (steerSep.lengthSq() > 0) {
            steerSep.normalize().multiplyScalar(fish.maxSpeed).sub(fish.vel).clampLength(0, fish.maxForce);
            fish.acc.addScaledVector(steerSep, 1.85);
          }
          if (countAli > 0) {
            steerAli.divideScalar(countAli).normalize().multiplyScalar(fish.maxSpeed).sub(fish.vel).clampLength(0, fish.maxForce);
            fish.acc.addScaledVector(steerAli, 1.15);
          }
          if (countCoh > 0) {
            steerCoh.divideScalar(countCoh).sub(fish.pos).normalize().multiplyScalar(fish.maxSpeed).sub(fish.vel).clampLength(0, fish.maxForce);
            fish.acc.addScaledVector(steerCoh, 0.95);
          }

          const schoolTarget = new THREE.Vector3(
            Math.sin(elapsed * 0.24) * 2.35,
            2.45 + Math.sin(elapsed * 0.41) * 0.48,
            Math.cos(elapsed * 0.31) * 1.15
          );
          tmpVec1.subVectors(schoolTarget, fish.pos).multiplyScalar(0.55);
          fish.acc.add(tmpVec1);
        } else {
          const wp = fish.wanderPhase + elapsed * (fish.isBottomDweller ? 0.32 : 0.48);
          const roamX = fish.isBottomDweller ? 2.85 : (fish.species === 'Ocellaris Clownfish' ? 0.55 : 1.85);
          const roamZ = fish.isBottomDweller ? 1.45 : (fish.species === 'Ocellaris Clownfish' ? 0.45 : 1.05);
          const targetPt = new THREE.Vector3(
            fish.homePos.x + Math.sin(wp) * roamX,
            fish.isBottomDweller ? getSandHeight(fish.pos.x, fish.pos.z) + 0.26 : fish.homePos.y + Math.sin(wp * 1.7) * 0.28,
            fish.homePos.z + Math.cos(wp * 0.85) * roamZ
          );
          tmpVec1.subVectors(targetPt, fish.pos);
          if (tmpVec1.lengthSq() > 0.01) {
            tmpVec1.normalize().multiplyScalar(fish.maxSpeed * 0.85).sub(fish.vel).clampLength(0, fish.maxForce);
            fish.acc.addScaledVector(tmpVec1, 1.0);
          }
        }

        let feedingBoost = 1.0;
        if (foodPellets.length > 0 && !fish.isBottomDweller) {
          let nearestDist = 4.6;
          let nearestPellet = null;
          for (let p = 0; p < foodPellets.length; p++) {
            const d = fish.pos.distanceTo(foodPellets[p].pos);
            if (d < nearestDist) {
              nearestDist = d;
              nearestPellet = foodPellets[p];
            }
          }
          if (nearestPellet) {
            feedingBoost = 1.65;
            tmpVec1.subVectors(nearestPellet.pos, fish.pos).normalize().multiplyScalar(fish.maxSpeed * feedingBoost);
            tmpVec1.sub(fish.vel).clampLength(0, fish.maxForce * 1.8);
            fish.acc.addScaledVector(tmpVec1, 2.4);
          }
        }

        if (cursorActive) {
          const dCursor = fish.pos.distanceTo(cursorWorldPos);
          if (dCursor < 1.35 && dCursor > 0.01) {
            tmpVec1.subVectors(fish.pos, cursorWorldPos).normalize();
            if (cursorSpeed > 18 || fish.isBoid) {
              fish.acc.addScaledVector(tmpVec1, (1.35 - dCursor) * 4.5);
            } else {
              tmpVec2.crossVectors(tmpVec1, upVec);
              fish.acc.addScaledVector(tmpVec2, (1.35 - dCursor) * 1.4);
            }
          }
        }

        for (let o = 0; o < obstacleSpheres.length; o++) {
          const obs = obstacleSpheres[o];
          const dObs = fish.pos.distanceTo(obs.pos);
          const safeDist = obs.radius + 0.35;
          if (dObs < safeDist && dObs > 0.001) {
            tmpVec1.subVectors(fish.pos, obs.pos).normalize();
            fish.acc.addScaledVector(tmpVec1, ((safeDist - dObs) / safeDist) * 8.5);
          }
        }

        const marginX = TANK.halfW - 0.38;
        const marginZ = TANK.halfD - 0.35;
        const minY = getSandHeight(fish.pos.x, fish.pos.z) + (fish.isBottomDweller ? 0.16 : 0.36);
        const maxY = TANK.waterY - 0.25;

        if (fish.pos.x > marginX) fish.acc.x -= (fish.pos.x - marginX) * 12.0;
        if (fish.pos.x < -marginX) fish.acc.x -= (fish.pos.x + marginX) * 12.0;
        if (fish.pos.z > marginZ) fish.acc.z -= (fish.pos.z - marginZ) * 12.0;
        if (fish.pos.z < -marginZ) fish.acc.z -= (fish.pos.z + marginZ) * 12.0;
        if (fish.pos.y > maxY) fish.acc.y -= (fish.pos.y - maxY) * 14.0;
        if (fish.pos.y < minY) fish.acc.y += (minY - fish.pos.y) * 16.0;

        fish.acc.x += Math.sin(elapsed * 0.4 + fish.pos.y) * 0.08 * currentSpeed;

        fish.vel.addScaledVector(fish.acc, dt);
        const speedLimit = fish.maxSpeed * feedingBoost;
        if (fish.vel.length() > speedLimit) fish.vel.setLength(speedLimit);
        if (fish.vel.length() < 0.18) fish.vel.setLength(0.18);

        fish.pos.addScaledVector(fish.vel, dt);
        fish.pos.x = THREE.MathUtils.clamp(fish.pos.x, -TANK.halfW + 0.22, TANK.halfW - 0.22);
        fish.pos.z = THREE.MathUtils.clamp(fish.pos.z, -TANK.halfD + 0.22, TANK.halfD - 0.22);
        const floorClamp = getSandHeight(fish.pos.x, fish.pos.z) + (fish.isBottomDweller ? 0.14 : 0.24);
        fish.pos.y = THREE.MathUtils.clamp(fish.pos.y, floorClamp, TANK.waterY - 0.15);

        tmpVec1.copy(fish.pos).add(fish.vel);
        lookMatrix.lookAt(tmpVec1, fish.pos, upVec);
        targetQuat.setFromRotationMatrix(lookMatrix);
        fish.mesh.quaternion.slerp(targetQuat, Math.min(1, dt * 6.5));

        const speedRatio = fish.vel.length() / fish.maxSpeed;
        fish.uniforms.uSwimPhase.value += dt * fish.swimFreqBase * (0.65 + speedRatio * 0.75);
      }
    }

    function updateFoodPellets(dt, elapsed) {
      for (let i = foodPellets.length - 1; i >= 0; i--) {
        const p = foodPellets[i];
        p.age += dt;
        const sandY = getSandHeight(p.pos.x, p.pos.z) + 0.02;
        if (p.pos.y > sandY) {
          p.pos.y -= p.sinkSpeed * dt;
          p.pos.x += Math.sin(elapsed * 2.2 + p.wobblePhase) * 0.06 * currentSpeed * dt;
          p.pos.z += Math.cos(elapsed * 1.9 + p.wobblePhase) * 0.05 * dt;
        }
        let eaten = false;
        for (let f = 0; f < allFish.length; f++) {
          if (allFish[f].pos.distanceToSquared(p.pos) < 0.048) {
            eaten = true;
            break;
          }
        }
        if (eaten || p.age > 24.0) {
          scene.remove(p.mesh);
          foodPellets.splice(i, 1);
        }
      }
    }

    function updateBubblesAndMeniscus(dt, elapsed) {
      const mAttr = meniscusGeo.attributes.position;
      for (let i = 0; i < meniscusPoints.length; i++) {
        const [mx, mz] = meniscusPoints[i];
        mAttr.setY(i, TANK.waterY + evalWaterWave(mx, mz, elapsed, currentSpeed));
      }
      mAttr.needsUpdate = true;

      const activeCount = Math.floor(maxBubbles * (bubbleIntensity / 1.5));
      for (let i = 0; i < maxBubbles; i++) {
        const b = bubbles[i];
        if (i >= activeCount) {
          dummy.position.set(0, -10, 0);
          dummy.scale.setScalar(0.001);
          dummy.updateMatrix();
          bubbleInst.setMatrixAt(i, dummy.matrix);
          continue;
        }

        b.pos.y += b.speed * (0.65 + bubbleIntensity * 0.5) * dt;
        const ageNorm = (b.pos.y - aeratorOrigin.y) / (TANK.waterY - aeratorOrigin.y);
        const wobbleX = Math.sin(elapsed * b.wobbleFreq + b.phase) * (0.04 + ageNorm * 0.14);
        const wobbleZ = Math.cos(elapsed * b.wobbleFreq * 0.9 + b.phase) * (0.04 + ageNorm * 0.14);
        const currentDrift = ageNorm * 0.25 * currentSpeed;

        if (b.pos.y >= TANK.waterY - 0.02) {
          b.pos.set(
            aeratorOrigin.x + (Math.random() - 0.5) * 0.26,
            aeratorOrigin.y,
            aeratorOrigin.z + (Math.random() - 0.5) * 0.26
          );
        }

        dummy.position.set(b.pos.x + wobbleX - currentDrift, b.pos.y, b.pos.z + wobbleZ);
        const scale = b.radius * (0.85 + ageNorm * 0.45);
        // Larger bubbles flatten into oblate spheroids as they ascend
        const oblate = Math.max(0.75, 1.0 - scale * 0.12);
        dummy.scale.set(scale * (1.0 + Math.sin(elapsed * 12 + b.phase) * 0.08), scale * oblate, scale);
        dummy.updateMatrix();
        bubbleInst.setMatrixAt(i, dummy.matrix);
      }
      bubbleInst.instanceMatrix.needsUpdate = true;

      const pAttr = planktonGeo.attributes.position;
      for (let i = 0; i < planktonCount; i++) {
        let px = pAttr.getX(i);
        let py = pAttr.getY(i);
        let pz = pAttr.getZ(i);
        const seed = planktonSeed[i];

        px += (Math.sin(elapsed * 0.35 + seed) * 0.04 + 0.03 * currentSpeed) * dt;
        py += Math.cos(elapsed * 0.28 + seed * 1.3) * 0.025 * dt;
        pz += Math.sin(elapsed * 0.31 + seed * 0.7) * 0.03 * dt;

        if (px > TANK.halfW - 0.15) px = -TANK.halfW + 0.15;
        if (px < -TANK.halfW + 0.15) px = TANK.halfW - 0.15;
        if (py > TANK.waterY - 0.15) py = 0.55;
        if (py < 0.45) py = TANK.waterY - 0.2;

        pAttr.setXYZ(i, px, py, pz);
      }
      pAttr.needsUpdate = true;
    }

    function updateLightingTransitions(dt) {
      const lerpRate = Math.min(1, dt * 2.8);
      scene.background.lerp(targetLighting.bg, lerpRate);
      scene.fog.color.lerp(targetLighting.fogColor, lerpRate);
      scene.fog.density = THREE.MathUtils.lerp(scene.fog.density, targetLighting.fogDensity, lerpRate);
      sharedOpticalUniforms.uAbsorptionCoeff.value.lerp(targetLighting.absorption, lerpRate);

      backdropUniforms.uTopColor.value.lerp(targetLighting.bdTop, lerpRate);
      backdropUniforms.uMidColor.value.lerp(targetLighting.bdMid, lerpRate);
      backdropUniforms.uBotColor.value.lerp(targetLighting.bdBot, lerpRate);
      diffuserMat.color.lerp(targetLighting.diffuserColor, lerpRate);

      hemiLight.color.lerp(targetLighting.hemiSky, lerpRate);
      hemiLight.groundColor.lerp(targetLighting.hemiGround, lerpRate);
      hemiLight.intensity = THREE.MathUtils.lerp(hemiLight.intensity, targetLighting.hemiInt, lerpRate);

      keyLight.color.lerp(targetLighting.keyColor, lerpRate);
      keyLight.intensity = THREE.MathUtils.lerp(keyLight.intensity, targetLighting.keyInt, lerpRate);
      keyLight.position.lerp(targetLighting.keyPos, lerpRate);

      rimLight.color.lerp(targetLighting.rimColor, lerpRate);
      rimLight.intensity = THREE.MathUtils.lerp(rimLight.intensity, targetLighting.rimInt, lerpRate);

      sharedOpticalUniforms.uCausticColor.value.lerp(targetLighting.causticColor, lerpRate);
      sharedOpticalUniforms.uCausticIntensity.value = THREE.MathUtils.lerp(
        sharedOpticalUniforms.uCausticIntensity.value, targetLighting.causticInt, lerpRate
      );

      waterSurfaceUniforms.uSkyColor.value.lerp(targetLighting.waterSky, lerpRate);
      waterSurfaceUniforms.uDeepWaterColor.value.lerp(targetLighting.waterDeep, lerpRate);
      waterSurfaceUniforms.uSunColor.value.lerp(targetLighting.keyColor, lerpRate);
      waterSurfaceUniforms.uSunDir.value.copy(keyLight.position).normalize();

      godRayUniforms.uRayColor.value.lerp(targetLighting.rayColor, lerpRate);
      godRayUniforms.uRayOpacity.value = THREE.MathUtils.lerp(
        godRayUniforms.uRayOpacity.value, targetLighting.rayOpacity, lerpRate
      );

      bloomPass.strength = THREE.MathUtils.lerp(bloomPass.strength, targetLighting.bloomStrength, lerpRate);
      brainMat.emissiveIntensity = THREE.MathUtils.lerp(brainMat.emissiveIntensity, targetLighting.brainEmissive, lerpRate);
      anemoneMat.emissiveIntensity = THREE.MathUtils.lerp(anemoneMat.emissiveIntensity, targetLighting.anemoneEmissive, lerpRate);
      bioPointLight.intensity = THREE.MathUtils.lerp(bioPointLight.intensity, targetLighting.bioLightInt, lerpRate);

      for (let i = 0; i < tetraSchool.length; i++) {
        tetraSchool[i].bodyMat.emissiveIntensity = THREE.MathUtils.lerp(
          tetraSchool[i].bodyMat.emissiveIntensity, targetLighting.tetraEmissive, lerpRate
        );
      }
      for (let i = 0; i < staghornMats.length; i++) {
        staghornMats[i].emissiveIntensity = THREE.MathUtils.lerp(
          staghornMats[i].emissiveIntensity, targetLighting === lightingModes.night ? 0.85 : 0.12, lerpRate
        );
      }
    }

    function updateCameraPresets(dt) {
      if (cameraMode === 'orbit') {
        controls.update();
      } else if (cameraMode === 'macro') {
        camera.position.lerp(macroCamPos, Math.min(1, dt * 2.5));
        controls.target.lerp(macroTargetPos, Math.min(1, dt * 3.0));
        camera.lookAt(controls.target);
      } else if (cameraMode === 'underwater') {
        camera.position.lerp(underwaterCamPos, Math.min(1, dt * 2.5));
        controls.target.lerp(underwaterTargetPos, Math.min(1, dt * 3.0));
        camera.lookAt(controls.target);
      } else if (cameraMode === 'follow') {
        const fish = allFish[followedFishIndex];
        tmpVec1.copy(fish.vel).normalize();
        const desiredCam = fish.pos.clone()
          .addScaledVector(tmpVec1, -1.55)
          .add(new THREE.Vector3(0, 0.34, 0.62));

        desiredCam.x = THREE.MathUtils.clamp(desiredCam.x, -TANK.halfW + 0.35, TANK.halfW - 0.35);
        desiredCam.y = THREE.MathUtils.clamp(desiredCam.y, 0.65, TANK.waterY - 0.25);
        desiredCam.z = THREE.MathUtils.clamp(desiredCam.z, -TANK.halfD + 0.35, TANK.halfD - 0.35);

        camera.position.lerp(desiredCam, Math.min(1, dt * 3.2));
        controls.target.lerp(fish.pos, Math.min(1, dt * 5.0));
        camera.lookAt(controls.target);
      }
    }

    // =========================================================================
    // 15. RESIZE & MAIN LOOP
    // =========================================================================
    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      composer.setSize(w, h);
      bloomPass.resolution.set(w, h);
    });

    const clock = new THREE.Clock();
    const telemetryEl = document.getElementById('telemetry');
    let frameCount = 0;
    let fpsTimer = 0;

    requestAnimationFrame(() => {
      setTimeout(() => {
        document.getElementById('loader').classList.add('hidden');
      }, 280);
    });

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.elapsedTime;
      sharedOpticalUniforms.uTime.value = elapsed;

      updateFishAI(dt, elapsed);
      updateFoodPellets(dt, elapsed);
      updateBubblesAndMeniscus(dt, elapsed);
      updateLightingTransitions(dt);
      updateCameraPresets(dt);

      composer.render();

      frameCount++;
      fpsTimer += dt;
      if (fpsTimer >= 0.75) {
        const fps = Math.round(frameCount / fpsTimer);
        telemetryEl.textContent = cameraMode === 'follow'
          ? `TRACKING: ${allFish[followedFishIndex].species.toUpperCase()} · ${fps} FPS`
          : `${allFish.length} ORGANISMS · ${fps} FPS`;
        frameCount = 0;
        fpsTimer = 0;
      }
    }

    animate();
  </script>
