<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AETHERIA PRO — Photorealistic 3D Reef & Aquascape Simulation</title>
  <style>
    :root {
      --glass-bg: rgba(7, 13, 22, 0.64);
      --glass-border: rgba(148, 218, 255, 0.22);
      --glass-highlight: rgba(255, 255, 255, 0.09);
      --accent: #38bdf8;
      --warm-accent: #fb923c;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #03060b;
      font-family: var(--font-sans);
      color: var(--text-primary);
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    #canvas-container:active {
      cursor: grabbing;
    }

    /* Loading Overlay */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: radial-gradient(circle at 50% 45%, #0c1d30 0%, #020509 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transition: opacity 0.85s ease, visibility 0.85s ease;
    }

    #loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-ring {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 2px solid rgba(56, 189, 248, 0.14);
      border-top-color: var(--accent);
      animation: spin 0.95s linear infinite;
    }

    .loader-text {
      font-size: 11px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Header HUD */
    .hud-header {
      position: fixed;
      top: 20px;
      left: 24px;
      right: 24px;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
    }

    .brand-badge {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.52), inset 0 1px 0 var(--glass-highlight);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 14px var(--accent);
    }

    .brand-title {
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-secondary);
      border-left: 1px solid rgba(255, 255, 255, 0.12);
      padding-left: 12px;
      font-family: var(--font-mono);
    }

    .top-actions {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.38);
    }

    .icon-btn:hover {
      border-color: rgba(56, 189, 248, 0.55);
      background: rgba(16, 30, 46, 0.78);
    }

    /* Bottom Dock */
    .hud-dock {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 13px;
      padding: 12px 18px;
      max-width: calc(100vw - 24px);
      background: var(--glass-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      box-shadow: 0 24px 56px rgba(0, 0, 0, 0.65), inset 0 1px 0 var(--glass-highlight);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .hud-hidden .hud-dock {
      opacity: 0;
      transform: translate(-50%, 24px);
      pointer-events: none;
    }

    .hud-hidden .brand-badge,
    .hud-hidden .hint-pill {
      opacity: 0;
      pointer-events: none;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .control-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-secondary);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .control-label span.val {
      font-family: var(--font-mono);
      color: var(--accent);
    }

    .divider {
      width: 1px;
      height: 36px;
      background: rgba(255, 255, 255, 0.1);
    }

    .feed-btn {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 11px 16px;
      border-radius: 13px;
      border: 1px solid rgba(251, 146, 60, 0.48);
      background: linear-gradient(135deg, rgba(251, 146, 60, 0.3), rgba(234, 88, 12, 0.18));
      color: #ffedd5;
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 0 22px rgba(251, 146, 60, 0.16);
    }

    .feed-btn:hover {
      background: linear-gradient(135deg, rgba(251, 146, 60, 0.45), rgba(234, 88, 12, 0.3));
      border-color: rgba(251, 146, 60, 0.85);
      transform: translateY(-1px);
    }

    .feed-btn:active {
      transform: translateY(1px) scale(0.98);
    }

    .segmented {
      display: inline-flex;
      background: rgba(3, 8, 15, 0.6);
      padding: 3px;
      border-radius: 11px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .seg-btn {
      padding: 6px 10px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 11.5px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .seg-btn:hover {
      color: var(--text-primary);
    }

    .seg-btn.active {
      background: rgba(56, 189, 248, 0.22);
      color: #e0f2fe;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.22), inset 0 0 0 1px rgba(56, 189, 248, 0.42);
    }

    .slider-wrap {
      display: flex;
      align-items: center;
      height: 28px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 94px;
      height: 4px;
      background: rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid #06101c;
      box-shadow: 0 0 10px var(--accent);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.22);
    }

    #cycle-fish-btn {
      display: none;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid rgba(56, 189, 248, 0.38);
      background: rgba(56, 189, 248, 0.16);
      color: #bae6fd;
      font-size: 11px;
      cursor: pointer;
      margin-left: 5px;
    }

    #cycle-fish-btn.visible {
      display: inline-block;
    }

    .hint-pill {
      position: fixed;
      top: 72px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      padding: 6px 15px;
      border-radius: 999px;
      background: rgba(6, 12, 22, 0.55);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 11px;
      color: var(--text-secondary);
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    @media (max-width: 1024px) {
      .divider { display: none; }
      .hud-dock { padding: 10px 14px; gap: 10px; }
      .brand-sub { display: none; }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

</head>
<body>
  <div id="loader">
    <div class="loader-ring"></div>
    <div class="loader-text">Synthesizing Optical Water, Scales &amp; Reef Shaders</div>
  </div>

  <div id="canvas-container"></div>

  <header class="hud-header">
    <div class="brand-badge">
      <div class="brand-dot"></div>
      <div class="brand-title">Aetheria Studio Reef</div>
      <div class="brand-sub" id="telemetry">34 ORGANISMS · 60 FPS</div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="toggle-hud-btn" title="Toggle Interface (H)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <span id="toggle-hud-label">Hide HUD</span>
      </button>
    </div>
  </header>

  <div class="hint-pill">Click water to create ripples &amp; drop food · Drag to orbit · Scroll to zoom · Space to feed</div>

  <div class="hud-dock">
    <button class="feed-btn" id="feed-btn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <circle cx="12" cy="7" r="2"/>
        <circle cx="7" cy="13" r="1.8"/>
        <circle cx="17" cy="13" r="1.8"/>
        <circle cx="12" cy="18" r="1.6"/>
      </svg>
      Drop Fish Food
    </button>

    <div class="divider"></div>

    <div class="control-group">
      <div class="control-label">Lighting Atmosphere</div>
      <div class="segmented" id="lighting-group">
        <button class="seg-btn active" data-mode="daylight">Daylight Reef</button>
        <button class="seg-btn" data-mode="sunset">Golden Sunset</button>
        <button class="seg-btn" data-mode="night">Bioluminescent</button>
      </div>
    </div>

    <div class="divider"></div>

    <div class="control-group">
      <div class="control-label">Camera View</div>
      <div style="display:flex; align-items:center;">
        <div class="segmented" id="camera-group">
          <button class="seg-btn active" data-cam="orbit">Free Orbit</button>
          <button class="seg-btn" data-cam="follow">Follow Fish</button>
          <button class="seg-btn" data-cam="macro">Macro Coral</button>
          <button class="seg-btn" data-cam="underwater">Snell's Window</button>
        </div>
        <button id="cycle-fish-btn" title="Switch Tracked Fish">Next ↻</button>
      </div>
    </div>

    <div class="divider"></div>

    <div class="control-group">
      <div class="control-label">Current <span class="val" id="current-val">1.0x</span></div>
      <div class="slider-wrap">
        <input type="range" id="current-slider" min="0.2" max="2.4" step="0.1" value="1.0" />
      </div>
    </div>

    <div class="control-group">
      <div class="control-label">Bubbles <span class="val" id="bubble-val">100%</span></div>
      <div class="slider-wrap">
        <input type="range" id="bubble-slider" min="0" max="150" step="5" value="100" />
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
    import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

    // =========================================================================
    // 1. TILEABLE MULTI-OCTAVE FBM & RIDGED NOISE + NORMAL MAP GENERATOR
    // =========================================================================
    class NoiseGen {
      constructor(seed = 8191) {
        this.p = new Uint8Array(512);
        const perm = new Uint8Array(256);
        for (let i = 0; i < 256; i++) perm[i] = i;
        let s = seed >>> 0;
        for (let i = 255; i > 0; i--) {
          s = (s * 1664525 + 1013904223) >>> 0;
          const j = s % (i + 1);
          const tmp = perm[i];
          perm[i] = perm[j];
          perm[j] = tmp;
        }
        for (let i = 0; i < 512; i++) this.p[i] = perm[i & 255];
      }

      fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
      lerp(t, a, b) { return a + t * (b - a); }
      grad(hash, x, y) {
        const h = hash & 7;
        const u = h < 4 ? x : y;
        const v = h < 4 ? y : x;
        return ((h & 1) ? -u : u) + ((h & 2) ? -2.0 * v : 2.0 * v);
      }

      noise2D(x, y, px = 256, py = 256) {
        const xi = Math.floor(x);
        const yi = Math.floor(y);
        const xf = x - xi;
        const yf = y - yi;
        const u = this.fade(xf);
        const v = this.fade(yf);

        const x0 = ((xi % px) + px) % px;
        const x1 = (x0 + 1) % px;
        const y0 = ((yi % py) + py) % py;
        const y1 = (y0 + 1) % py;

        const aa = this.p[this.p[x0] + y0];
        const ab = this.p[this.p[x0] + y1];
        const ba = this.p[this.p[x1] + y0];
        const bb = this.p[this.p[x1] + y1];

        const x1Interp = this.lerp(u, this.grad(aa, xf, yf), this.grad(ba, xf - 1, yf));
        const x2Interp = this.lerp(u, this.grad(ab, xf, yf - 1), this.grad(bb, xf - 1, yf - 1));
        return this.lerp(v, x1Interp, x2Interp) * 0.5 + 0.5;
      }

      fbm(x, y, octaves = 4, periodX = 8, periodY = 8) {
        let value = 0;
        let amp = 0.5;
        let freq = 1;
        let norm = 0;
        for (let i = 0; i < octaves; i++) {
          value += amp * this.noise2D(x * freq, y * freq, periodX * freq, periodY * freq);
          norm += amp;
          amp *= 0.5;
          freq *= 2;
        }
        return value / norm;
      }

      ridged(x, y, octaves = 4, periodX = 8, periodY = 8) {
        let value = 0;
        let amp = 0.5;
        let freq = 1;
        let norm = 0;
        for (let i = 0; i < octaves; i++) {
          let n = this.noise2D(x * freq, y * freq, periodX * freq, periodY * freq);
          n = 1.0 - Math.abs(n * 2.0 - 1.0);
          value += amp * n * n;
          norm += amp;
          amp *= 0.5;
          freq *= 2;
        }
        return value / norm;
      }
    }

    const noise = new NoiseGen(9001);

    function heightToNormalTexture(heightData, width, height, strength = 3.2, repeatX = 1, repeatY = 1) {
      const data = new Uint8Array(width * height * 4);
      for (let y = 0; y < height; y++) {
        const ym = (y - 1 + height) % height;
        const yp = (y + 1) % height;
        for (let x = 0; x < width; x++) {
          const xm = (x - 1 + width) % width;
          const xp = (x + 1) % width;

          const tl = heightData[ym * width + xm];
          const t  = heightData[ym * width + x];
          const tr = heightData[ym * width + xp];
          const l  = heightData[y * width + xm];
          const r  = heightData[y * width + xp];
          const bl = heightData[yp * width + xm];
          const b  = heightData[yp * width + x];
          const br = heightData[yp * width + xp];

          const dx = (tr + 2 * r + br) - (tl + 2 * l + bl);
          const dy = (bl + 2 * b + br) - (tl + 2 * t + tr);

          let nx = -dx * strength;
          let ny = -dy * strength;
          let nz = 1.0;
          const invLen = 1.0 / Math.hypot(nx, ny, nz);
          nx *= invLen;
          ny *= invLen;
          nz *= invLen;

          const idx = (y * width + x) * 4;
          data[idx]     = Math.round((nx * 0.5 + 0.5) * 255);
          data[idx + 1] = Math.round((ny * 0.5 + 0.5) * 255);
          data[idx + 2] = Math.round((nz * 0.5 + 0.5) * 255);
          data[idx + 3] = 255;
        }
      }
      const tex = new THREE.DataTexture(data, width, height, THREE.RGBAFormat);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(repeatX, repeatY);
      tex.needsUpdate = true;
      return tex;
    }

    // =========================================================================
    // 2. HIGH-RESOLUTION PROCEDURAL PBR TEXTURES (WATER RIPPLES, SAND, ROCK, SCALES)
    // =========================================================================
    function createProceduralPBRTextures() {
      const size = 512;

      // 1. Water Surface Capillary Ripple Normal Map (512x512)
      const waterHeight = new Float32Array(size * size);
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const u = x / size;
          const v = y / size;
          const w1 = noise.fbm(u * 8, v * 8, 4, 8, 8);
          const w2 = noise.ridged(u * 16 + 2.1, v * 16 + 4.3, 3, 16, 16);
          const capillary = Math.sin((u * 24 + v * 18 + w1 * 2.5) * Math.PI * 2) * 0.15;
          waterHeight[y * size + x] = w1 * 0.55 + w2 * 0.30 + capillary;
        }
      }
      const waterNormalMap = heightToNormalTexture(waterHeight, size, size, 2.2, 1, 1);

      // 2. Fine Silica Coral Sand (Albedo, Normal, Roughness)
      const sandAlbedo = new Uint8Array(size * size * 4);
      const sandRough = new Uint8Array(size * size * 4);
      const sandHeight = new Float32Array(size * size);

      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const u = x / size;
          const v = y / size;
          const warp = noise.fbm(u * 5, v * 5, 3, 5, 5);
          const ripple = Math.sin((u * 16 + v * 3.5 + warp * 1.6) * Math.PI * 2) * 0.5 + 0.5;
          const micro = noise.fbm(u * 110, v * 110, 2, 110, 110);
          const shellSpeck = micro > 0.77 ? 1.0 : 0.0;
          const h = ripple * 0.62 + micro * 0.34 + shellSpeck * 0.08;
          sandHeight[y * size + x] = h;

          const idx = (y * size + x) * 4;
          const r = 226 + (micro - 0.5) * 32 + (ripple - 0.5) * 14 + shellSpeck * 20;
          const g = 214 + (micro - 0.5) * 30 + (ripple - 0.5) * 12 + shellSpeck * 18;
          const b = 190 + (micro - 0.5) * 28 + (ripple - 0.5) * 10 + shellSpeck * 16;
          sandAlbedo[idx]     = Math.min(255, Math.max(0, r));
          sandAlbedo[idx + 1] = Math.min(255, Math.max(0, g));
          sandAlbedo[idx + 2] = Math.min(255, Math.max(0, b));
          sandAlbedo[idx + 3] = 255;

          const rough = Math.round(184 + (1.0 - micro) * 60 - shellSpeck * 55);
          sandRough[idx] = sandRough[idx + 1] = sandRough[idx + 2] = Math.max(70, rough);
          sandRough[idx + 3] = 255;
        }
      }

      const sandMap = new THREE.DataTexture(sandAlbedo, size, size, THREE.RGBAFormat);
      sandMap.colorSpace = THREE.SRGBColorSpace;
      sandMap.wrapS = sandMap.wrapT = THREE.RepeatWrapping;
      sandMap.repeat.set(6, 4);
      sandMap.needsUpdate = true;

      const sandRoughMap = new THREE.DataTexture(sandRough, size, size, THREE.RGBAFormat);
      sandRoughMap.wrapS = sandRoughMap.wrapT = THREE.RepeatWrapping;
      sandRoughMap.repeat.set(6, 4);
      sandRoughMap.needsUpdate = true;

      const sandNormalMap = heightToNormalTexture(sandHeight, size, size, 3.8, 6, 4);

      // 3. Seiryu Aquascaping Stone (Dark Blue-Grey Limestone + White Calcite Veins)
      const rockAlbedo = new Uint8Array(size * size * 4);
      const rockRough = new Uint8Array(size * size * 4);
      const rockHeight = new Float32Array(size * size);

      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const u = x / size;
          const v = y / size;
          const ridge = noise.ridged(u * 7, v * 7, 5, 7, 7);
          const strata = Math.sin((u * 6 + v * 12 + ridge * 2.2) * Math.PI * 2) * 0.5 + 0.5;
          const micro = noise.fbm(u * 44, v * 44, 3, 44, 44);
          const veinNoise = Math.abs(noise.fbm(u * 9 + 1.4, v * 9 + 3.2, 4, 9, 9) - 0.5);
          const vein = Math.pow(Math.max(0, 1.0 - veinNoise * 28.0), 2.5);

          const h = ridge * 0.55 + strata * 0.25 + micro * 0.16 + vein * 0.08;
          rockHeight[y * size + x] = h;

          const idx = (y * size + x) * 4;
          const base = 44 + h * 66;
          rockAlbedo[idx]     = Math.min(255, base * 0.94 + vein * 140);
          rockAlbedo[idx + 1] = Math.min(255, base * 0.98 + vein * 144);
          rockAlbedo[idx + 2] = Math.min(255, base * 1.08 + vein * 150);
          rockAlbedo[idx + 3] = 255;

          const rough = Math.round(112 + (1.0 - h) * 95);
          rockRough[idx] = rockRough[idx + 1] = rockRough[idx + 2] = rough;
          rockRough[idx + 3] = 255;
        }
      }

      const rockMap = new THREE.DataTexture(rockAlbedo, size, size, THREE.RGBAFormat);
      rockMap.colorSpace = THREE.SRGBColorSpace;
      rockMap.wrapS = rockMap.wrapT = THREE.RepeatWrapping;
      rockMap.repeat.set(2, 2);
      rockMap.needsUpdate = true;

      const rockRoughMap = new THREE.DataTexture(rockRough, size, size, THREE.RGBAFormat);
      rockRoughMap.wrapS = rockRoughMap.wrapT = THREE.RepeatWrapping;
      rockRoughMap.repeat.set(2, 2);
      rockRoughMap.needsUpdate = true;

      const rockNormalMap = heightToNormalTexture(rockHeight, size, size, 5.6, 2, 2);

      // 4. Wet Red Moor Driftwood Bark Maps
      const woodAlbedo = new Uint8Array(size * size * 4);
      const woodHeight = new Float32Array(size * size);
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const u = x / size;
          const v = y / size;
          const warp = noise.fbm(u * 4, v * 10, 4, 4, 10);
          const fiber = Math.sin((u * 36 + warp * 5.0) * Math.PI * 2) * 0.5 + 0.5;
          const fine = noise.fbm(u * 64, v * 12, 2, 64, 12);
          const h = fiber * 0.72 + fine * 0.28;
          woodHeight[y * size + x] = h;

          const idx = (y * size + x) * 4;
          woodAlbedo[idx]     = Math.round(52 + h * 50);
          woodAlbedo[idx + 1] = Math.round(31 + h * 32);
          woodAlbedo[idx + 2] = Math.round(19 + h * 20);
          woodAlbedo[idx + 3] = 255;
        }
      }
      const woodMap = new THREE.DataTexture(woodAlbedo, size, size, THREE.RGBAFormat);
      woodMap.colorSpace = THREE.SRGBColorSpace;
      woodMap.wrapS = woodMap.wrapT = THREE.RepeatWrapping;
      woodMap.repeat.set(2, 4);
      woodMap.needsUpdate = true;
      const woodNormalMap = heightToNormalTexture(woodHeight, size, size, 5.0, 2, 4);

      // 5. Overlapping Cycloid Fish Scales Normal Map (512x512 crisp micro-relief)
      const scaleSize = 512;
      const scaleHeight = new Float32Array(scaleSize * scaleSize);
      const cols = 24;
      const rows = 18;
      for (let y = 0; y < scaleSize; y++) {
        for (let x = 0; x < scaleSize; x++) {
          const u = (x / scaleSize) * cols;
          const v = (y / scaleSize) * rows;
          const rowIdx = Math.floor(v);
          const shiftU = u + (rowIdx % 2 === 0 ? 0.5 : 0.0);
          const fu = (shiftU % 1.0) - 0.5;
          const fv = (v % 1.0) - 0.5;
          const dist = Math.hypot(fu * 1.15, fv);
          const dome = Math.max(0, 1.0 - dist * dist * 2.1);
          const rim = Math.exp(-Math.pow((dist - 0.45) * 12.0, 2.0)) * 0.32;
          scaleHeight[y * scaleSize + x] = dome * 0.72 + rim;
        }
      }
      const scaleNormalMap = heightToNormalTexture(scaleHeight, scaleSize, scaleSize, 2.8, 2, 2);

      // 6. Delicate Fin-Ray Alpha & Normal Map (512x512 gossamer membrane + bony rays)
      const finCanvas = document.createElement('canvas');
      finCanvas.width = 512;
      finCanvas.height = 512;
      const fCtx = finCanvas.getContext('2d');
      fCtx.fillStyle = '#000000';
      fCtx.fillRect(0, 0, 512, 512);

      const memGrad = fCtx.createLinearGradient(0, 0, 0, 512);
      memGrad.addColorStop(0.0, 'rgba(255,255,255,0.94)');
      memGrad.addColorStop(0.55, 'rgba(255,255,255,0.56)');
      memGrad.addColorStop(0.88, 'rgba(255,255,255,0.24)');
      memGrad.addColorStop(1.0, 'rgba(255,255,255,0.02)');
      fCtx.fillStyle = memGrad;
      fCtx.fillRect(0, 0, 512, 512);

      for (let i = 0; i < 36; i++) {
        const rx = (i / 35) * 512;
        fCtx.strokeStyle = 'rgba(255,255,255,0.72)';
        fCtx.lineWidth = 3.2;
        fCtx.beginPath();
        fCtx.moveTo(rx, 0);
        fCtx.quadraticCurveTo(rx + (rx - 256) * 0.05, 256, rx + (rx - 256) * 0.14, 508);
        fCtx.stroke();
      }
      const finAlphaMap = new THREE.CanvasTexture(finCanvas);
      finAlphaMap.needsUpdate = true;

      // 7. Brain Coral Labyrinth Maps
      const brainAlbedo = new Uint8Array(size * size * 4);
      const brainEmissive = new Uint8Array(size * size * 4);
      const brainHeight = new Float32Array(size * size);
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const u = x / size;
          const v = y / size;
          const w1 = noise.fbm(u * 6, v * 6, 4, 6, 6);
          const w2 = noise.fbm(u * 6 + 2.4, v * 6 + 4.1, 4, 6, 6);
          const ridge = Math.abs(Math.sin((w1 * 9.5 + w2 * 5.2) * Math.PI));
          const groove = Math.pow(ridge, 0.52);
          brainHeight[y * size + x] = groove;

          const idx = (y * size + x) * 4;
          brainAlbedo[idx]     = Math.round(38 + groove * 176);
          brainAlbedo[idx + 1] = Math.round(82 + groove * 144);
          brainAlbedo[idx + 2] = Math.round(62 + groove * 70);
          brainAlbedo[idx + 3] = 255;

          const valleyGlow = Math.pow(1.0 - groove, 2.4);
          brainEmissive[idx]     = Math.round(valleyGlow * 30);
          brainEmissive[idx + 1] = Math.round(valleyGlow * 245);
          brainEmissive[idx + 2] = Math.round(valleyGlow * 195);
          brainEmissive[idx + 3] = 255;
        }
      }
      const brainMap = new THREE.DataTexture(brainAlbedo, size, size, THREE.RGBAFormat);
      brainMap.colorSpace = THREE.SRGBColorSpace;
      brainMap.wrapS = brainMap.wrapT = THREE.RepeatWrapping;
      brainMap.needsUpdate = true;

      const brainEmissiveMap = new THREE.DataTexture(brainEmissive, size, size, THREE.RGBAFormat);
      brainEmissiveMap.colorSpace = THREE.SRGBColorSpace;
      brainEmissiveMap.wrapS = brainEmissiveMap.wrapT = THREE.RepeatWrapping;
      brainEmissiveMap.needsUpdate = true;

      const brainNormalMap = heightToNormalTexture(brainHeight, size, size, 6.2, 1, 1);

      // 8. Staghorn Coral Corallite Polyp Normal Map
      const coralHeight = new Float32Array(256 * 256);
      for (let y = 0; y < 256; y++) {
        for (let x = 0; x < 256; x++) {
          const u = x / 256;
          const v = y / 256;
          const cup = Math.sin(u * Math.PI * 24) * Math.sin(v * Math.PI * 24);
          coralHeight[y * 256 + x] = noise.fbm(u * 24, v * 24, 3, 24, 24) * 0.7 + cup * 0.3;
        }
      }
      const coralNormalMap = heightToNormalTexture(coralHeight, 256, 256, 3.8, 3, 3);

      return {
        waterNormalMap,
        sandMap, sandNormalMap, sandRoughMap,
        rockMap, rockNormalMap, rockRoughMap,
        woodMap, woodNormalMap,
        scaleNormalMap, finAlphaMap,
        brainMap, brainNormalMap, brainEmissiveMap,
        coralNormalMap
      };
    }

    // =========================================================================
    // 3. SYNTHETIC HDRI STUDIO ENVIRONMENT + PMREM GENERATOR
    // =========================================================================
    function createStudioEnvironment(renderer) {
      const pmremGenerator = new THREE.PMREMGenerator(renderer);
      pmremGenerator.compileEquirectangularShader();
      const rgbeLoader = new RGBELoader();
      void rgbeLoader;

      const w = 512;
      const h = 256;
      const floatData = new Float32Array(w * h * 4);

      for (let y = 0; y < h; y++) {
        const theta = (y / h) * Math.PI;
        const sinTheta = Math.sin(theta);
        const cosTheta = Math.cos(theta);
        for (let x = 0; x < w; x++) {
          const phi = (x / w) * Math.PI * 2;
          const dx = sinTheta * Math.cos(phi);
          const dy = cosTheta;
          const dz = sinTheta * Math.sin(phi);

          let r = 0.025;
          let g = 0.055;
          let b = 0.095;

          // High-CRI overhead aquarium LED luminaire reflection
          if (dy > 0.74 && Math.abs(dx) < 0.68 && Math.abs(dz) < 0.44) {
            const soft = THREE.MathUtils.smoothstep(dy, 0.74, 0.89);
            r += 6.8 * soft;
            g += 7.4 * soft;
            b += 8.2 * soft;
          }

          // Studio softboxes for realistic glass and scale reflections
          const leftBox = Math.exp(-((dx + 0.86) ** 2 * 16 + (dy - 0.22) ** 2 * 11 + (dz - 0.36) ** 2 * 9));
          const rightBox = Math.exp(-((dx - 0.86) ** 2 * 16 + (dy - 0.18) ** 2 * 11 + (dz + 0.36) ** 2 * 9));
          r += leftBox * 2.5 + rightBox * 2.0;
          g += leftBox * 3.0 + rightBox * 2.4;
          b += leftBox * 3.6 + rightBox * 2.9;

          const idx = (y * w + x) * 4;
          floatData[idx]     = r;
          floatData[idx + 1] = g;
          floatData[idx + 2] = b;
          floatData[idx + 3] = 1.0;
        }
      }

      const equirectTex = new THREE.DataTexture(floatData, w, h, THREE.RGBAFormat, THREE.FloatType);
      equirectTex.mapping = THREE.EquirectangularReflectionMapping;
      equirectTex.needsUpdate = true;

      const envRT = pmremGenerator.fromEquirectangular(equirectTex);
      equirectTex.dispose();
      pmremGenerator.dispose();
      return envRT.texture;
    }

    // =========================================================================
    // 4. SHARED OPTICAL UNIFORMS (CAUSTICS + BEER-LAMBERT DEPTH ABSORPTION)
    // =========================================================================
    const sharedOpticalUniforms = {
      uTime: { value: 0 },
      uCurrentSpeed: { value: 1.0 },
      uCausticIntensity: { value: 0.92 },
      uCausticColor: { value: new THREE.Color(0xc4f4ff) },
      uWaterLevel: { value: 4.35 },
      uAbsorptionCoeff: { value: new THREE.Vector3(0.11, 0.032, 0.016) }
    };

    function applyUnderwaterOpticalShader(material, strengthMultiplier = 1.0, cacheId = 'default') {
      material.customProgramCacheKey = () => `underwater_optical_${cacheId}`;
      material.onBeforeCompile = (shader) => {
        shader.uniforms.uTime = sharedOpticalUniforms.uTime;
        shader.uniforms.uCurrentSpeed = sharedOpticalUniforms.uCurrentSpeed;
        shader.uniforms.uCausticIntensity = sharedOpticalUniforms.uCausticIntensity;
        shader.uniforms.uCausticColor = sharedOpticalUniforms.uCausticColor;
        shader.uniforms.uWaterLevel = sharedOpticalUniforms.uWaterLevel;
        shader.uniforms.uAbsorptionCoeff = sharedOpticalUniforms.uAbsorptionCoeff;
        shader.uniforms.uLocalStrength = { value: strengthMultiplier };

        shader.vertexShader = shader.vertexShader
          .replace(
            '#include <common>',
            `#include <common>
            varying vec3 vOptWorldPos;
            varying vec3 vOptWorldNormal;`
          )
          .replace(
            '#include <project_vertex>',
            `#include <project_vertex>
            vec4 optWPos = modelMatrix * vec4(transformed, 1.0);
            #ifdef USE_INSTANCING
              optWPos = modelMatrix * instanceMatrix * vec4(transformed, 1.0);
            #endif
            vOptWorldPos = optWPos.xyz;
            vec3 optObjNorm = objectNormal;
            #ifdef USE_INSTANCING
              optObjNorm = mat3(instanceMatrix) * optObjNorm;
            #endif
            vOptWorldNormal = normalize(mat3(modelMatrix) * optObjNorm);`
          );

        shader.fragmentShader = shader.fragmentShader
          .replace(
            '#include <common>',
            `#include <common>
            uniform float uTime;
            uniform float uCurrentSpeed;
            uniform float uCausticIntensity;
            uniform vec3 uCausticColor;
            uniform float uWaterLevel;
            uniform vec3 uAbsorptionCoeff;
            uniform float uLocalStrength;
            varying vec3 vOptWorldPos;
            varying vec3 vOptWorldNormal;

            float causticWave(vec2 uv, float t) {
              vec2 p = mod(uv * 6.2831853, 6.2831853) - 250.0;
              vec2 i = p;
              float c = 1.0;
              float inten = 0.005;
              for (int n = 0; n < 4; n++) {
                float time = t * (1.0 - (3.5 / float(n + 1)));
                i = p + vec2(
                  cos(time - i.x) + sin(time + i.y),
                  sin(time - i.y) + cos(time + i.x)
                );
                c += 1.0 / length(vec2(
                  p.x / (sin(i.x + time) / inten),
                  p.y / (cos(i.y + time) / inten)
                ));
              }
              c /= 4.0;
              c = 1.17 - pow(c, 1.44);
              return pow(abs(c), 8.2);
            }

            vec3 computeUnderwaterCaustics(vec3 worldPos, vec3 worldNormal) {
              if (worldPos.y > uWaterLevel) return vec3(0.0);
              float depth = max(0.0, uWaterLevel - worldPos.y);
              float facing = smoothstep(-0.18, 0.85, worldNormal.y);
              float depthAtten = exp(-depth * 0.11);
              float t = uTime * (0.5 + uCurrentSpeed * 0.38);

              vec2 baseUV = worldPos.xz * 0.22 + worldPos.y * 0.032;
              vec2 uv2 = worldPos.xz * 0.36 - vec2(t * 0.026, -t * 0.018);
              float cR = causticWave(baseUV + vec2(0.0055, 0.002), t) + causticWave(uv2 + vec2(0.004, 0.0), -t * 0.78) * 0.48;
              float cG = causticWave(baseUV, t) + causticWave(uv2, -t * 0.78) * 0.48;
              float cB = causticWave(baseUV - vec2(0.0055, 0.002), t) + causticWave(uv2 - vec2(0.004, 0.0), -t * 0.78) * 0.48;

              return vec3(cR, cG, cB) * uCausticColor * uCausticIntensity * uLocalStrength * facing * depthAtten;
            }`
          )
          .replace(
            '#include <tonemapping_fragment>',
            `float waterDepth = max(0.0, uWaterLevel - vOptWorldPos.y);
            vec3 transmittance = exp(-waterDepth * uAbsorptionCoeff);
            outgoingLight = outgoingLight * transmittance + computeUnderwaterCaustics(vOptWorldPos, vOptWorldNormal);
            #include <tonemapping_fragment>`
          );
      };
    }

    // =========================================================================
    // 5. HIGH-RES 1024x1024 ANATOMICAL FISH TEXTURES & 3D EYE / FIN BUILDERS
    // =========================================================================
    function createFishTextures() {
      const makeTex = (w, h, drawFn) => {
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        drawFn(ctx, w, h);
        const tex = new THREE.CanvasTexture(canvas);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.needsUpdate = true;
        return tex;
      };

      const drawGillAndLateralLine = (ctx, w, h, gillColor, lineColor) => {
        // Curved operculum (gill flap) ridge & shadow around u = 0.77
        ctx.strokeStyle = gillColor;
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.arc(w * 0.81, h * 0.52, h * 0.27, Math.PI * 0.74, Math.PI * 1.26);
        ctx.stroke();

        // Subtle lateral line sensory pore curve along flank
        ctx.strokeStyle = lineColor;
        ctx.lineWidth = 3;
        ctx.setLineDash([6, 6]);
        ctx.beginPath();
        ctx.moveTo(w * 0.74, h * 0.42);
        ctx.quadraticCurveTo(w * 0.48, h * 0.36, w * 0.18, h * 0.48);
        ctx.stroke();
        ctx.setLineDash([]);
      };

      // 1. Cardinal / Neon Tetra (1024x1024)
      const tetraTex = makeTex(1024, 1024, (ctx, w, h) => {
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0.0, '#233642');
        grad.addColorStop(0.30, '#6c95a8');
        grad.addColorStop(0.41, '#00f7ff'); // Electric neon cyan-blue lateral stripe
        grad.addColorStop(0.53, '#00b4ff');
        grad.addColorStop(0.57, '#ff0f3b'); // Deep cardinal crimson belly
        grad.addColorStop(0.86, '#c40028');
        grad.addColorStop(1.0, '#f8fafc');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
        drawGillAndLateralLine(ctx, w, h, 'rgba(15, 23, 42, 0.45)', 'rgba(255,255,255,0.2)');
      });

      const tetraEmissive = makeTex(512, 512, (ctx, w, h) => {
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, w, h);
        const grad = ctx.createLinearGradient(0, h * 0.33, 0, h * 0.78);
        grad.addColorStop(0.0, 'rgba(0, 245, 255, 0)');
        grad.addColorStop(0.24, 'rgba(0, 248, 255, 1.0)');
        grad.addColorStop(0.52, 'rgba(255, 24, 72, 0.85)');
        grad.addColorStop(1.0, 'rgba(255, 24, 72, 0)');
        ctx.fillStyle = grad;
        ctx.fillRect(w * 0.08, h * 0.33, w * 0.82, h * 0.45);
      });

      // 2. Royal Blue Tang (Paracanthurus hepatus)
      const tangTex = makeTex(1024, 1024, (ctx, w, h) => {
        const bodyGrad = ctx.createLinearGradient(0, 0, 0, h);
        bodyGrad.addColorStop(0, '#092f94');
        bodyGrad.addColorStop(0.5, '#134ce0');
        bodyGrad.addColorStop(1, '#0a35a4');
        ctx.fillStyle = bodyGrad;
        ctx.fillRect(0, 0, w, h);

        // Canary yellow caudal fin + peduncle wedge
        const tailGrad = ctx.createLinearGradient(0, 0, w * 0.24, 0);
        tailGrad.addColorStop(0, '#ffe600');
        tailGrad.addColorStop(0.76, '#ffcb05');
        tailGrad.addColorStop(1, '#134ce0');
        ctx.fillStyle = tailGrad;
        ctx.fillRect(0, 0, w * 0.24, h);

        // Iconic black surgeonfish palette marking
        ctx.fillStyle = '#060a12';
        ctx.beginPath();
        ctx.ellipse(w * 0.56, h * 0.42, w * 0.27, h * 0.21, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillRect(w * 0.14, h * 0.43, w * 0.38, h * 0.14);

        // Inner cobalt blue oval
        ctx.fillStyle = '#195af5';
        ctx.beginPath();
        ctx.ellipse(w * 0.58, h * 0.43, w * 0.15, h * 0.11, 0, 0, Math.PI * 2);
        ctx.fill();

        drawGillAndLateralLine(ctx, w, h, 'rgba(5, 10, 22, 0.65)', 'rgba(56, 189, 248, 0.25)');
      });

      // 3. Ocellaris Clownfish
      const clownTex = makeTex(1024, 1024, (ctx, w, h) => {
        const bg = ctx.createLinearGradient(0, 0, 0, h);
        bg.addColorStop(0, '#d43c04');
        bg.addColorStop(0.45, '#ff6210');
        bg.addColorStop(1, '#f97316');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, w, h);

        const drawBand = (cx, bw) => {
          ctx.fillStyle = '#080a0f';
          ctx.fillRect(cx - bw * 0.5 - 12, 0, bw + 24, h);
          ctx.fillStyle = '#f8fafc';
          ctx.fillRect(cx - bw * 0.5, 0, bw, h);
        };
        drawBand(w * 0.21, w * 0.075);
        drawBand(w * 0.51, w * 0.125);
        drawBand(w * 0.77, w * 0.095);

        drawGillAndLateralLine(ctx, w, h, 'rgba(15, 15, 20, 0.45)', 'rgba(255,255,255,0.12)');
      });

      // 4. Altum / Silver-Pearl Angelfish
      const angelTex = makeTex(1024, 1024, (ctx, w, h) => {
        const base = ctx.createLinearGradient(0, 0, 0, h);
        base.addColorStop(0, '#788a9f');
        base.addColorStop(0.32, '#e2e8f0');
        base.addColorStop(0.68, '#cbd5e1');
        base.addColorStop(1, '#64748b');
        ctx.fillStyle = base;
        ctx.fillRect(0, 0, w, h);

        const stripe = (cx, sw, alpha) => {
          const g = ctx.createLinearGradient(cx - sw, 0, cx + sw, 0);
          g.addColorStop(0, 'rgba(12, 18, 28, 0)');
          g.addColorStop(0.35, `rgba(12, 18, 28, ${alpha})`);
          g.addColorStop(0.65, `rgba(12, 18, 28, ${alpha})`);
          g.addColorStop(1, 'rgba(12, 18, 28, 0)');
          ctx.fillStyle = g;
          ctx.fillRect(cx - sw, 0, sw * 2, h);
        };
        stripe(w * 0.23, w * 0.06, 0.78);
        stripe(w * 0.51, w * 0.08, 0.86);
        stripe(w * 0.84, w * 0.055, 0.84);

        drawGillAndLateralLine(ctx, w, h, 'rgba(15, 23, 42, 0.45)', 'rgba(255,255,255,0.2)');
      });

      // 5. Copperband Butterflyfish (Chelmon rostratus)
      const butterflyTex = makeTex(1024, 1024, (ctx, w, h) => {
        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(0, 0, w, h);

        // Pearlescent horizontal pinstripes
        ctx.fillStyle = 'rgba(203, 213, 225, 0.55)';
        for (let y = 0; y < h; y += 26) {
          ctx.fillRect(0, y, w, 9);
        }

        // Four vertical copper-orange bands with dark borders
        const drawCopperBand = (cx, bw) => {
          ctx.fillStyle = '#1e293b';
          ctx.fillRect(cx - bw * 0.5 - 5, 0, bw + 10, h);
          const g = ctx.createLinearGradient(cx - bw * 0.5, 0, cx + bw * 0.5, 0);
          g.addColorStop(0, '#d97706');
          g.addColorStop(0.5, '#f59e0b');
          g.addColorStop(1, '#d97706');
          ctx.fillStyle = g;
          ctx.fillRect(cx - bw * 0.5, 0, bw, h);
        };
        drawCopperBand(w * 0.22, w * 0.075);
        drawCopperBand(w * 0.45, w * 0.085);
        drawCopperBand(w * 0.66, w * 0.075);
        drawCopperBand(w * 0.85, w * 0.055);

        // Iconic false eyespot (ocellus) on rear dorsal flank
        const ox = w * 0.23;
        const oy = h * 0.26;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(ox, oy, 46, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#090d16';
        ctx.beginPath();
        ctx.arc(ox, oy, 34, 0, Math.PI * 2);
        ctx.fill();
      });

      // 6. Blue-Spotted Ribbontail Stingray
      const rayTex = makeTex(1024, 1024, (ctx, w, h) => {
        const grad = ctx.createRadialGradient(w * 0.5, h * 0.5, 24, w * 0.5, h * 0.5, w * 0.5);
        grad.addColorStop(0, '#8f7736');
        grad.addColorStop(0.65, '#b29647');
        grad.addColorStop(1, '#d9c47c');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);

        for (let i = 0; i < 95; i++) {
          const sx = ((i * 73 + 19) % 880) + 72;
          const sy = ((i * 137 + 31) % 880) + 72;
          const rad = 14 + (i % 10);
          ctx.fillStyle = '#0f172a';
          ctx.beginPath();
          ctx.arc(sx, sy, rad + 5, 0, Math.PI * 2);
          ctx.fill();

          const sGrad = ctx.createRadialGradient(sx - 4, sy - 4, 2, sx, sy, rad);
          sGrad.addColorStop(0, '#7dd3fc');
          sGrad.addColorStop(0.65, '#0284c7');
          sGrad.addColorStop(1, '#0369a1');
          ctx.fillStyle = sGrad;
          ctx.beginPath();
          ctx.arc(sx, sy, rad, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      // 3D Eyeball Iris Texture
      const eyeTex = makeTex(256, 256, (ctx, w, h) => {
        const cx = w * 0.5;
        const cy = h * 0.5;
        const grad = ctx.createRadialGradient(cx, cy, 24, cx, cy, 128);
        grad.addColorStop(0.0, '#020408');
        grad.addColorStop(0.42, '#020408');
        grad.addColorStop(0.46, '#facc15');
        grad.addColorStop(0.78, '#ca8a04');
        grad.addColorStop(1.0, '#0f172a');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
      });

      return { tetraTex, tetraEmissive, tangTex, clownTex, angelTex, butterflyTex, rayTex, eyeTex };
    }

    // Builds Anatomical Fish Body + Separate Gossamer Fins + 3D Eye Socket Coordinates
    function buildAnatomicalFishGeometries({
      length, height, width, tailHeight, tailLength, dorsalHeight,
      tallVeil = false, snoutExtension = 0.0
    }) {
      const segZ = 40;
      const segRad = 26;
      const bPos = [];
      const bUvs = [];
      const bIdx = [];

      const noseZ = length * 0.5 + snoutExtension;
      const tailBaseZ = -length * 0.34;
      const bodySpan = noseZ - tailBaseZ;

      for (let iz = 0; iz <= segZ; iz++) {
        const t = iz / segZ; // 0 = nose, 1 = peduncle
        const z = noseZ - t * bodySpan;
        let arch = Math.sin(Math.pow(t, 0.62) * Math.PI);

        // Optional slender forceps snout (for Copperband Butterflyfish)
        if (snoutExtension > 0 && t < 0.22) {
          const st = t / 0.22;
          arch = THREE.MathUtils.lerp(0.09, Math.sin(Math.pow(0.22, 0.62) * Math.PI), Math.pow(st, 1.35));
        }

        const profileH = arch * (1.0 - 0.28 * t) + 0.032 * (1.0 - t);
        const profileW = arch * (1.0 - 0.38 * t) + 0.026 * (1.0 - t);
        const camberY = Math.sin(t * Math.PI) * height * 0.04;

        for (let ir = 0; ir <= segRad; ir++) {
          const theta = (ir / segRad) * Math.PI * 2;
          const sinT = Math.sin(theta);
          const cosT = Math.cos(theta);

          let x = sinT * width * 0.5 * profileW;
          let y = cosT * height * 0.5 * profileH + camberY;

          // Operculum (gill plate) subtle ridge at t = 0.26
          const gillFlare = Math.exp(-Math.pow((t - 0.26) * 16.0, 2.0)) * Math.abs(sinT);
          x *= (1.0 + gillFlare * 0.09);

          bPos.push(x, y, z);
          bUvs.push(1.0 - t * 0.78, 0.5 - cosT * 0.5);
        }
      }

      const stride = segRad + 1;
      for (let iz = 0; iz < segZ; iz++) {
        for (let ir = 0; ir < segRad; ir++) {
          const a = iz * stride + ir;
          const b = a + stride;
          const c = b + 1;
          const d = a + 1;
          bIdx.push(a, b, d);
          bIdx.push(b, c, d);
        }
      }

      const bodyGeo = new THREE.BufferGeometry();
      bodyGeo.setAttribute('position', new THREE.Float32BufferAttribute(bPos, 3));
      bodyGeo.setAttribute('uv', new THREE.Float32BufferAttribute(bUvs, 2));
      bodyGeo.setIndex(bIdx);
      bodyGeo.computeVertexNormals();

      // Delicate Curved Fins Geometry
      const fPos = [];
      const fUvs = [];
      const fIdx = [];

      const addCurvedFinRibbon = (rootPts, tipPts, segs = 10) => {
        const base = fPos.length / 3;
        for (let i = 0; i <= segs; i++) {
          const u = i / segs;
          fPos.push(
            THREE.MathUtils.lerp(rootPts[0][0], rootPts[1][0], u),
            THREE.MathUtils.lerp(rootPts[0][1], rootPts[1][1], u),
            THREE.MathUtils.lerp(rootPts[0][2], rootPts[1][2], u)
          );
          fUvs.push(u, 0.0);

          fPos.push(
            THREE.MathUtils.lerp(tipPts[0][0], tipPts[1][0], u),
            THREE.MathUtils.lerp(tipPts[0][1], tipPts[1][1], u),
            THREE.MathUtils.lerp(tipPts[0][2], tipPts[1][2], u)
          );
          fUvs.push(u, 1.0);
        }
        for (let i = 0; i < segs; i++) {
          const a = base + i * 2;
          const b = a + 1;
          const c = a + 3;
          const d = a + 2;
          fIdx.push(a, b, d);
          fIdx.push(b, c, d);
        }
      };

      const tipZ = tailBaseZ - tailLength;
      const forkZ = tipZ + tailLength * (tallVeil ? 0.14 : 0.32);
      addCurvedFinRibbon(
        [[0, 0, tailBaseZ + 0.015], [0, height * 0.09, tailBaseZ + 0.01]],
        [[0, 0, forkZ], [0, tailHeight * 0.52, tipZ]],
        8
      );
      addCurvedFinRibbon(
        [[0, -height * 0.09, tailBaseZ + 0.01], [0, 0, tailBaseZ + 0.015]],
        [[0, -tailHeight * 0.52, tipZ], [0, 0, forkZ]],
        8
      );

      const dTopZ = tallVeil ? -length * 0.44 : -length * 0.22;
      const dTopY = height * 0.42 + dorsalHeight;
      addCurvedFinRibbon(
        [[0, height * 0.36, length * 0.10], [0, height * 0.22, -length * 0.26]],
        [[0, dTopY, dTopZ], [0, height * 0.34, -length * 0.32]],
        10
      );

      const aBotZ = tallVeil ? -length * 0.44 : -length * 0.24;
      const aBotY = -height * 0.40 - dorsalHeight * (tallVeil ? 0.96 : 0.45);
      addCurvedFinRibbon(
        [[0, -height * 0.34, 0.02], [0, -height * 0.18, -length * 0.28]],
        [[0, aBotY, aBotZ], [0, -height * 0.28, -length * 0.33]],
        10
      );

      const pSpan = width * 1.75;
      addCurvedFinRibbon(
        [[width * 0.38, -height * 0.05, length * 0.16], [width * 0.36, -height * 0.16, length * 0.02]],
        [[width * 0.38 + pSpan, -height * 0.08, -length * 0.04], [width * 0.36 + pSpan * 0.85, -height * 0.24, -length * 0.08]],
        6
      );
      addCurvedFinRibbon(
        [[-width * 0.38, -height * 0.05, length * 0.16], [-width * 0.36, -height * 0.16, length * 0.02]],
        [[-width * 0.38 - pSpan, -height * 0.08, -length * 0.04], [-width * 0.36 - pSpan * 0.85, -height * 0.24, -length * 0.08]],
        6
      );

      const finGeo = new THREE.BufferGeometry();
      finGeo.setAttribute('position', new THREE.Float32BufferAttribute(fPos, 3));
      finGeo.setAttribute('uv', new THREE.Float32BufferAttribute(fUvs, 2));
      finGeo.setIndex(fIdx);
      finGeo.computeVertexNormals();

      // Calculate exact 3D Eye Socket Placement on the Head
      const eyeZ = length * 0.34;
      const eyeY = height * 0.11;
      const eyeX = width * 0.33;
      const eyeRadius = Math.min(height, width * 2.2) * 0.125;

      return { bodyGeo, finGeo, eyePos: { x: eyeX, y: eyeY, z: eyeZ, r: eyeRadius } };
    }

    function buildStingrayGeometry() {
      const geom = new THREE.SphereGeometry(0.46, 48, 36);
      const pos = geom.attributes.position;
      const uv = geom.attributes.uv;
      for (let i = 0; i < pos.count; i++) {
        let x = pos.getX(i);
        let y = pos.getY(i);
        let z = pos.getZ(i);

        y *= 0.18;
        const normZ = z / 0.46;
        const wingShape = 1.28 - Math.abs(normZ - 0.08) * 0.42;
        x *= wingShape * 1.48;
        z *= 1.16;

        const centerDist = Math.hypot(x * 1.15, z);
        if (y > 0) {
          y += Math.exp(-centerDist * centerDist * 18.0) * 0.06;
          const eyeDistL = Math.hypot(x + 0.08, z - 0.18);
          const eyeDistR = Math.hypot(x - 0.08, z - 0.18);
          y += (Math.exp(-eyeDistL * eyeDistL * 650) + Math.exp(-eyeDistR * eyeDistR * 650)) * 0.03;
        } else {
          y *= 0.42;
        }

        if (z < -0.35) {
          const t = (-z - 0.35) / 0.18;
          z -= t * 0.72;
          x *= Math.max(0.035, 1.0 - t * 0.95);
          y *= Math.max(0.07, 1.0 - t * 0.90);
        }

        pos.setXYZ(i, x, y, z);
        uv.setXY(i, x / 1.38 + 0.5, z / 1.42 + 0.5);
      }
      geom.computeVertexNormals();
      return geom;
    }

    // GPU Vertex Swim + Subsurface Scattering + Guanine Iridescence Shader
    function applyFishSwimShader(material, sharedUniforms, cacheId, isFin = false) {
      material.customProgramCacheKey = () => `fish_swim_v3_${cacheId}`;
      material.onBeforeCompile = (shader) => {
        Object.assign(shader.uniforms, sharedUniforms);
        shader.uniforms.uIsFin = { value: isFin ? 1.0 : 0.0 };

        shader.vertexShader = shader.vertexShader
          .replace(
            '#include <common>',
            `#include <common>
            uniform float uSwimPhase;
            uniform float uWaveFreq;
            uniform float uWaveAmp;
            uniform float uNoseZ;
            uniform float uBodyLength;
            uniform float uIsRay;
            varying vec3 vOptWorldPos;
            varying vec3 vOptWorldNormal;
            varying vec3 vViewDirection;`
          )
          .replace(
            '#include <begin_vertex>',
            `#include <begin_vertex>
            if (uIsRay > 0.5) {
              float wingSpan = smoothstep(0.08, 0.72, abs(position.x));
              float wingWave = sin(abs(position.x) * 4.6 - uSwimPhase + position.z * 2.5);
              transformed.y += wingWave * uWaveAmp * wingSpan;
              float tailFactor = clamp((-position.z - 0.15) / 0.88, 0.0, 1.0);
              transformed.x += sin(tailFactor * 5.2 - uSwimPhase * 1.2) * 0.065 * tailFactor;
            } else {
              float bodyT = clamp((uNoseZ - position.z) / uBodyLength, 0.0, 1.0);
              float envelope = pow(bodyT, 1.55);
              float lateralWave = sin(bodyT * uWaveFreq - uSwimPhase) * uWaveAmp * envelope;
              transformed.x += lateralWave;

              // Independent pectoral fin rowing
              float finMask = smoothstep(0.035, 0.10, abs(position.x)) * (1.0 - smoothstep(0.25, 0.58, bodyT));
              if (finMask > 0.01) {
                float flap = sin(uSwimPhase * 1.75) * 0.42 * finMask;
                transformed.y += flap * abs(position.x);
                transformed.z -= abs(flap) * 0.04;
              }
            }`
          )
          .replace(
            '#include <project_vertex>',
            `#include <project_vertex>
            vec4 optWPos = modelMatrix * vec4(transformed, 1.0);
            vOptWorldPos = optWPos.xyz;
            vOptWorldNormal = normalize(mat3(modelMatrix) * objectNormal);
            vViewDirection = normalize(cameraPosition - optWPos.xyz);`
          );

        shader.fragmentShader = shader.fragmentShader
          .replace(
            '#include <common>',
            `#include <common>
            uniform float uTime;
            uniform float uCurrentSpeed;
            uniform float uCausticIntensity;
            uniform vec3 uCausticColor;
            uniform float uWaterLevel;
            uniform vec3 uAbsorptionCoeff;
            uniform float uIsFin;
            varying vec3 vOptWorldPos;
            varying vec3 vOptWorldNormal;
            varying vec3 vViewDirection;

            float fishCaustic(vec2 uv, float t) {
              vec2 p = mod(uv * 6.2831853, 6.2831853) - 250.0;
              vec2 i = p;
              float c = 1.0;
              float inten = 0.006;
              for (int n = 0; n < 3; n++) {
                float time = t * (1.0 - (3.5 / float(n + 1)));
                i = p + vec2(cos(time - i.x) + sin(time + i.y), sin(time - i.y) + cos(time + i.x));
                c += 1.0 / length(vec2(p.x / (sin(i.x + time) / inten), p.y / (cos(i.y + time) / inten)));
              }
              c /= 3.0;
              c = 1.17 - pow(c, 1.4);
              return pow(abs(c), 7.4);
            }`
          )
          .replace(
            '#include <tonemapping_fragment>',
            `vec3 nWorld = normalize(vOptWorldNormal);
            vec3 vDir = normalize(vViewDirection);
            float fresnel = pow(1.0 - abs(dot(nWorld, vDir)), 3.2);

            // Guanine pearlescent scale iridescence + warm subsurface fin translucency
            vec3 iridTint = mix(vec3(0.45, 0.88, 1.0), vec3(1.0, 0.85, 0.65), nWorld.y * 0.5 + 0.5);
            outgoingLight += iridTint * fresnel * (uIsFin > 0.5 ? 0.42 : 0.24);

            // Overhead light subsurface glow through translucent fins & belly
            float topLightScatter = clamp(nWorld.y * 0.5 + 0.5, 0.0, 1.0);
            if (uIsFin > 0.5) {
              outgoingLight += diffuseColor.rgb * topLightScatter * 0.35;
            }

            float fFacing = smoothstep(-0.1, 0.9, nWorld.y);
            float fDepth = max(0.0, uWaterLevel - vOptWorldPos.y);
            float fC = fishCaustic(vOptWorldPos.xz * 0.22, uTime * (0.5 + uCurrentSpeed * 0.38));
            vec3 trans = exp(-fDepth * uAbsorptionCoeff);
            outgoingLight = outgoingLight * trans + uCausticColor * fC * uCausticIntensity * 0.62 * fFacing * exp(-fDepth * 0.12);
            #include <tonemapping_fragment>`
          );
      };
    }

    // =========================================================================
    // 6. SCENE, RENDERER, POST-PROCESSING & OPTICAL LENS PASS
    // =========================================================================
    const container = document.getElementById('canvas-container');
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x04070d);
    scene.fog = new THREE.FogExp2(0x072034, 0.032);

    const envTexture = createStudioEnvironment(renderer);
    scene.environment = envTexture;

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.08, 60);
    camera.position.set(0.0, 2.65, 10.5);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2.1, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.minDistance = 1.8;
    controls.maxDistance = 17.5;
    controls.maxPolarAngle = Math.PI * 0.58;
    controls.minPolarAngle = 0.14;

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));

    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.32,
      0.60,
      0.85
    );
    composer.addPass(bloomPass);

    const opticalLensShader = {
      uniforms: {
        tDiffuse: { value: null },
        uVignette: { value: 0.24 },
        uDispersion: { value: 0.0011 }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float uVignette;
        uniform float uDispersion;
        varying vec2 vUv;
        void main() {
          vec2 center = vUv - 0.5;
          float r2 = dot(center, center);
          vec2 offset = center * r2 * uDispersion;
          float r = texture2D(tDiffuse, vUv + offset).r;
          float g = texture2D(tDiffuse, vUv).g;
          float b = texture2D(tDiffuse, vUv - offset).b;
          vec3 col = vec3(r, g, b);
          float vig = smoothstep(0.86, 0.26, sqrt(r2));
          col *= mix(1.0 - uVignette, 1.0, vig);
          gl_FragColor = vec4(col, 1.0);
        }
      `
    };
    composer.addPass(new ShaderPass(opticalLensShader));
    composer.addPass(new OutputPass());

    const TANK = {
      halfW: 4.2,
      halfD: 2.3,
      height: 4.6,
      waterY: 4.35
    };

    // High-Resolution 4096x4096 Soft Shadow Lighting Rig
    const hemiLight = new THREE.HemisphereLight(0x88e5ff, 0x1e293b, 1.05);
    scene.add(hemiLight);

    const keyLight = new THREE.DirectionalLight(0xfff8ef, 3.15);
    keyLight.position.set(2.2, 9.8, 2.8);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(4096, 4096);
    keyLight.shadow.camera.near = 2;
    keyLight.shadow.camera.far = 18;
    keyLight.shadow.camera.left = -5.2;
    keyLight.shadow.camera.right = 5.2;
    keyLight.shadow.camera.top = 5.2;
    keyLight.shadow.camera.bottom = -5.2;
    keyLight.shadow.bias = -0.0003;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x38bdf8, 1.3);
    rimLight.position.set(-4.5, 4.2, -4.5);
    scene.add(rimLight);

    const bioPointLight = new THREE.PointLight(0x00f5d4, 0.18, 9.5);
    bioPointLight.position.set(1.6, 1.3, 0.2);
    scene.add(bioPointLight);

    const pbr = createProceduralPBRTextures();

    // =========================================================================
    // 7. ADA BACKLIT SCREEN, SCULPTED SUBSTRATE, ROCKS, DRIFTWOOD & CORALS
    // =========================================================================
    const backdropUniforms = {
      uTopColor: { value: new THREE.Color(0x0a3858) },
      uMidColor: { value: new THREE.Color(0x287ea4) },
      uBotColor: { value: new THREE.Color(0x82daf0) }
    };
    const backdropMat = new THREE.ShaderMaterial({
      uniforms: backdropUniforms,
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform vec3 uTopColor;
        uniform vec3 uMidColor;
        uniform vec3 uBotColor;
        varying vec2 vUv;
        void main() {
          float horizon = smoothstep(0.04, 0.40, vUv.y);
          float upper = smoothstep(0.36, 0.96, vUv.y);
          vec3 col = mix(uBotColor, uMidColor, horizon);
          col = mix(col, uTopColor, upper);
          float sideDim = smoothstep(0.0, 0.14, vUv.x) * smoothstep(1.0, 0.86, vUv.x);
          col *= mix(0.75, 1.0, sideDim);
          gl_FragColor = vec4(col, 1.0);
        }
      `
    });
    const backdropScreen = new THREE.Mesh(
      new THREE.PlaneGeometry(TANK.halfW * 2 - 0.04, TANK.height - 0.04),
      backdropMat
    );
    backdropScreen.position.set(0, TANK.height * 0.5, -TANK.halfD - 0.03);
    scene.add(backdropScreen);

    function getSandHeight(x, z) {
      const d1 = Math.sin(x * 0.72 + 0.35) * Math.cos(z * 1.15) * 0.14;
      const d2 = Math.sin(x * 2.1 - z * 1.5) * 0.04;
      const leftMound = Math.exp(-((x + 2.35) ** 2 * 0.45 + (z + 0.35) ** 2 * 0.65)) * 0.44;
      const rightMound = Math.exp(-((x - 2.25) ** 2 * 0.45 + (z - 0.15) ** 2 * 0.65)) * 0.40;
      return 0.25 + d1 + d2 + leftMound + rightMound;
    }

    const sandGeo = new THREE.PlaneGeometry(TANK.halfW * 2 - 0.04, TANK.halfD * 2 - 0.04, 152, 84);
    sandGeo.rotateX(-Math.PI / 2);
    const sandPos = sandGeo.attributes.position;
    const sandColors = new Float32Array(sandPos.count * 3);
    for (let i = 0; i < sandPos.count; i++) {
      const x = sandPos.getX(i);
      const z = sandPos.getZ(i);
      const y = getSandHeight(x, z);
      sandPos.setY(i, y);

      const rockProx = Math.exp(-((x + 2.3) ** 2 + (z + 0.3) ** 2) * 0.6) +
                       Math.exp(-((x - 2.2) ** 2 + (z - 0.1) ** 2) * 0.6);
      const shade = THREE.MathUtils.clamp(0.96 - rockProx * 0.24 + (y - 0.25) * 0.32, 0.70, 1.06);
      sandColors[i * 3]     = shade;
      sandColors[i * 3 + 1] = shade * 0.98;
      sandColors[i * 3 + 2] = shade * 0.95;
    }
    sandGeo.setAttribute('color', new THREE.BufferAttribute(sandColors, 3));
    sandGeo.computeVertexNormals();

    const sandMat = new THREE.MeshStandardMaterial({
      map: pbr.sandMap,
      normalMap: pbr.sandNormalMap,
      normalScale: new THREE.Vector2(0.95, 0.95),
      roughnessMap: pbr.sandRoughMap,
      roughness: 0.85,
      metalness: 0.02,
      vertexColors: true
    });
    applyUnderwaterOpticalShader(sandMat, 1.22, 'sand');

    const sandMesh = new THREE.Mesh(sandGeo, sandMat);
    sandMesh.receiveShadow = true;
    scene.add(sandMesh);

    // Sand Cross-Section Skirt
    const skirtMat = new THREE.MeshStandardMaterial({
      map: pbr.sandMap,
      color: 0xb9a88a,
      roughness: 0.94
    });
    const buildSandSkirt = () => {
      const hw = TANK.halfW - 0.02;
      const hd = TANK.halfD - 0.02;
      const segs = 84;
      const positions = [];
      const uvs = [];
      const indices = [];
      const perimeter = [];
      for (let i = 0; i <= segs; i++) perimeter.push([-hw + (2 * hw * i) / segs, hd]);
      for (let i = 1; i <= segs; i++) perimeter.push([hw, hd - (2 * hd * i) / segs]);
      for (let i = 1; i <= segs; i++) perimeter.push([hw - (2 * hw * i) / segs, -hd]);
      for (let i = 1; i <= segs; i++) perimeter.push([-hw, -hd + (2 * hd * i) / segs]);

      for (let i = 0; i < perimeter.length; i++) {
        const [x, z] = perimeter[i];
        const topY = getSandHeight(x, z);
        positions.push(x, topY, z);
        uvs.push((i / segs) * 3, topY);
        positions.push(x, 0.02, z);
        uvs.push((i / segs) * 3, 0);
      }

      for (let i = 0; i < perimeter.length - 1; i++) {
        const a = i * 2;
        const b = a + 1;
        const c = a + 3;
        const d = a + 2;
        indices.push(a, b, d);
        indices.push(b, c, d);
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      g.setIndex(indices);
      g.computeVertexNormals();
      scene.add(new THREE.Mesh(g, skirtMat));
    };
    buildSandSkirt();

    // 420 Instanced Natural River Gravel, Coral Rubble & Pebbles
    const obstacleSpheres = [];
    const pebbleGeo = new THREE.IcosahedronGeometry(0.085, 2);
    const pPos = pebbleGeo.attributes.position;
    for (let i = 0; i < pPos.count; i++) {
      const vx = pPos.getX(i);
      const vy = pPos.getY(i);
      const vz = pPos.getZ(i);
      const n = noise.fbm(vx * 9 + 2, vz * 9 + 4, 2, 18, 18);
      pPos.setXYZ(i, vx * (0.88 + n * 0.38), vy * 0.50, vz * (0.85 + n * 0.42));
    }
    pebbleGeo.computeVertexNormals();

    const pebbleMat = new THREE.MeshStandardMaterial({
      map: pbr.rockMap,
      normalMap: pbr.rockNormalMap,
      roughness: 0.60,
      metalness: 0.04
    });
    applyUnderwaterOpticalShader(pebbleMat, 0.95, 'pebbles');

    const pebbleCount = 420;
    const pebbleInst = new THREE.InstancedMesh(pebbleGeo, pebbleMat, pebbleCount);
    pebbleInst.receiveShadow = true;
    const dummy = new THREE.Object3D();
    const colorTmp = new THREE.Color();

    for (let i = 0; i < pebbleCount; i++) {
      let rx, rz;
      if (i < 280) {
        const cluster = i % 2 === 0 ? { x: -2.35, z: -0.25 } : { x: 2.25, z: -0.05 };
        const ang = Math.random() * Math.PI * 2;
        const rad = 0.50 + Math.random() * 1.55;
        rx = THREE.MathUtils.clamp(cluster.x + Math.cos(ang) * rad, -TANK.halfW + 0.25, TANK.halfW - 0.25);
        rz = THREE.MathUtils.clamp(cluster.z + Math.sin(ang) * rad, -TANK.halfD + 0.25, TANK.halfD - 0.25);
      } else {
        rx = (Math.random() - 0.5) * (TANK.halfW * 2 - 0.45);
        rz = (Math.random() - 0.5) * (TANK.halfD * 2 - 0.45);
      }
      const ry = getSandHeight(rx, rz);
      dummy.position.set(rx, ry + 0.014, rz);
      dummy.rotation.set((Math.random() - 0.5) * 0.35, Math.random() * Math.PI * 2, (Math.random() - 0.5) * 0.35);
      const s = 0.35 + Math.random() * 1.3;

    pebbleInst.instanceMatrix.needsUpdate = true;
    if (pebbleInst.instanceColor) pebbleInst.instanceColor.needsUpdate = true;
    scene.add(pebbleInst);

    // Craggy Seiryu Rocks
    const rockMat = new THREE.MeshStandardMaterial({
      map: pbr.rockMap,
      normalMap: pbr.rockNormalMap,
      normalScale: new THREE.Vector2(1.4, 1.4),
      roughnessMap: pbr.rockRoughMap,
      roughness: 0.70,
      metalness: 0.04,
      vertexColors: true
    });
    applyUnderwaterOpticalShader(rockMat, 1.08, 'rocks');

    function createSculptedSeiryuRock(rx, ry, rz, sx, sy, sz, seedOffset = 0, hasMoss = true) {
      const geo = new THREE.IcosahedronGeometry(1.0, 4);
      const pos = geo.attributes.position;
      const colors = new Float32Array(pos.count * 3);

      for (let i = 0; i < pos.count; i++) {
        let vx = pos.getX(i);
        let vy = pos.getY(i);
        let vz = pos.getZ(i);

        const n1 = noise.ridged(vx * 2.4 + seedOffset, vz * 2.4 + seedOffset, 4, 16, 16);
        const strata = Math.sin(vy * 11.0 + n1 * 3.4) * 0.075;
        const disp = 0.68 + n1 * 0.56 + strata;

        vx *= sx * disp;
        vy *= sy * disp * (vy < 0 ? 0.62 : 1.05);
        vz *= sz * disp;
        pos.setXYZ(i, vx, vy, vz);

        const ao = THREE.MathUtils.clamp(0.46 + n1 * 0.64, 0.40, 1.14);
        const upFactor = hasMoss ? THREE.MathUtils.smoothstep(vy / sy, 0.38, 0.88) * n1 : 0;
        colors[i * 3]     = ao * (1.0 - upFactor * 0.52);
        colors[i * 3 + 1] = ao * (1.0 + upFactor * 0.20);
        colors[i * 3 + 2] = ao * (1.0 - upFactor * 0.62);
      }
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      geo.computeVertexNormals();

      const mesh = new THREE.Mesh(geo, rockMat);
      mesh.position.set(rx, ry, rz);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);

      obstacleSpheres.push({
        pos: new THREE.Vector3(rx, ry + sy * 0.25, rz),
        radius: Math.max(sx, sz) * 0.84
      });
    }

    createSculptedSeiryuRock(-2.55, 0.54, -0.45, 1.18, 1.02, 0.88, 1.2, true);
    createSculptedSeiryuRock(-1.75, 0.42,  0.15, 0.78, 0.65, 0.72, 3.7, true);
    createSculptedSeiryuRock(-3.15, 0.45,  0.35, 0.68, 0.58, 0.62, 6.4, false);

    createSculptedSeiryuRock( 2.35, 0.58, -0.25, 1.28, 1.12, 0.92, 9.1, true);
    createSculptedSeiryuRock( 1.55, 0.38,  0.38, 0.72, 0.55, 0.65, 12.5, true);
    createSculptedSeiryuRock( 3.05, 0.46,  0.42, 0.76, 0.66, 0.68, 15.8, false);

    // Gnarled Wet Red Moor Driftwood + Anubias Epiphytes
    const woodMat = new THREE.MeshStandardMaterial({
      map: pbr.woodMap,
      normalMap: pbr.woodNormalMap,
      normalScale: new THREE.Vector2(1.3, 1.3),
      roughness: 0.46,
      metalness: 0.04
    });
    applyUnderwaterOpticalShader(woodMat, 0.90, 'driftwood');

    function buildTaperedBranch(points, startRad, endRad, radialSegs = 14, tubularSegs = 40) {
      const curve = new THREE.CatmullRomCurve3(points);
      const frames = curve.computeFrenetFrames(tubularSegs, false);
      const positions = [];
      const uvs = [];
      const indices = [];

      for (let i = 0; i <= tubularSegs; i++) {
        const t = i / tubularSegs;
        const pt = curve.getPointAt(t);
        const N = frames.normals[i];
        const B = frames.binormals[i];
        const rad = THREE.MathUtils.lerp(startRad, endRad, Math.pow(t, 0.78));

        for (let j = 0; j <= radialSegs; j++) {
          const v = (j / radialSegs) * Math.PI * 2;
          const flute = 1.0 + Math.sin(v * 6 + t * 9) * 0.13;
          const r = rad * flute;
          const sin = Math.sin(v);
          const cos = -Math.cos(v);

          positions.push(
            pt.x + r * (cos * N.x + sin * B.x),
            pt.y + r * (cos * N.y + sin * B.y),
            pt.z + r * (cos * N.z + sin * B.z)
          );
          uvs.push(j / radialSegs, t * 3.5);
        }
      }

      const stride = radialSegs + 1;
      for (let i = 0; i < tubularSegs; i++) {
        for (let j = 0; j < radialSegs; j++) {
          const a = i * stride + j;
          const b = a + stride;
          const c = b + 1;
          const d = a + 1;
          indices.push(a, b, d);
          indices.push(b, c, d);
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      const mesh = new THREE.Mesh(geo, woodMat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);

      obstacleSpheres.push({ pos: curve.getPointAt(0.52), radius: startRad * 2.1 });
    }

    buildTaperedBranch([
      new THREE.Vector3(-2.5, 0.55, -0.4),
      new THREE.Vector3(-1.7, 1.38, -0.25),
      new THREE.Vector3(-0.72, 2.10, 0.05),
      new THREE.Vector3(0.32, 2.45, -0.15)
    ], 0.25, 0.03);

    buildTaperedBranch([
      new THREE.Vector3(-1.6, 1.35, -0.22),
      new THREE.Vector3(-1.08, 2.18, -0.55),
      new THREE.Vector3(-0.42, 2.85, -0.72)
    ], 0.145, 0.018);

    buildTaperedBranch([
      new THREE.Vector3(-2.2, 0.72, -0.2),
      new THREE.Vector3(-1.42, 1.06, 0.45),
      new THREE.Vector3(-0.72, 1.32, 0.88)
    ], 0.135, 0.02);

    // Anubias Rosettes
    const anubiasLeafGeo = new THREE.SphereGeometry(0.11, 12, 10);
    anubiasLeafGeo.scale(0.65, 0.08, 1.45);
    anubiasLeafGeo.translate(0, 0, 0.12);
    const anubiasMat = new THREE.MeshStandardMaterial({
      color: 0x1e5c38,

      metalness: 0.04
    });
    applyUnderwaterOpticalShader(anubiasMat, 0.88, 'anubias');
    const anubiasInst = new THREE.InstancedMesh(anubiasLeafGeo, anubiasMat, 54);
    const anubiasAnchors = [
      new THREE.Vector3(-1.65, 1.42, -0.22),
      new THREE.Vector3(-1.12, 1.85, -0.10),
      new THREE.Vector3(-1.95, 1.05, 0.12)
    ];
    for (let i = 0; i < 54; i++) {
      const anc = anubiasAnchors[i % anubiasAnchors.length];
      dummy.position.set(
        anc.x + (Math.random() - 0.5) * 0.24,
        anc.y + (Math.random() - 0.3) * 0.14,

      );
      dummy.rotation.set(
        -0.25 + (Math.random() - 0.5) * 0.55,
        Math.random() * Math.PI * 2,

      );
      dummy.scale.setScalar(0.7 + Math.random() * 0.65);
      dummy.updateMatrix();
      anubiasInst.setMatrixAt(i, dummy.matrix);
      colorTmp.setHSL(0.38 + (Math.random() - 0.5) * 0.04, 0.62, 0.22 + Math.random() * 0.12);
      anubiasInst.setColorAt(i, colorTmp);
    }
    anubiasInst.instanceMatrix.needsUpdate = true;
    if (anubiasInst.instanceColor) anubiasInst.instanceColor.needsUpdate = true;
    scene.add(anubiasInst);

    // Brain Corals
    const brainMat = new THREE.MeshStandardMaterial({
      map: pbr.brainMap,
      normalMap: pbr.brainNormalMap,
      normalScale: new THREE.Vector2(1.5, 1.5),
      emissiveMap: pbr.brainEmissiveMap,
      emissive: new THREE.Color(0x00ffd5),
